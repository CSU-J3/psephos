# psephos source registry and watchlist
# Collectors load this. Admiralty grades follow the cyber-osint-research skill:
# source reliability A-F, information credibility 1-6.
# Verify feed/endpoint URLs on first run; the structure matters more than any single URL.

meta:
  project: psephos
  timezone: America/Denver
  cron: "0 */6 * * *"   # every 6 hours, matches existing tracker cadence

# ===========================================================================
# CHANNEL 1: LEGISLATION  (Congress.gov API)
# ===========================================================================
legislation:
  api:
    base: https://api.congress.gov/v3
    key_env: CONGRESS_API_KEY        # free key: https://api.congress.gov
    rate_limit_per_hour: 5000
  # Per bill, pull:
  #   /bill/{congress}/{type}/{number}
  #   /bill/{congress}/{type}/{number}/actions
  #   /bill/{congress}/{type}/{number}/amendments
  #   /bill/{congress}/{type}/{number}/relatedbills
  #   /bill/{congress}/{type}/{number}/cosponsors
  default_grade: { source: A, info: "1" }   # primary government record
  watchlist:
    - bill_id: hr22-119
      congress: 119
      type: hr
      number: 22
      short_title: SAVE Act
      watch_reason: Original proof-of-citizenship registration bill; House-passed 220-208 (Apr 2025).
    - bill_id: s128-119
      congress: 119
      type: s
      number: 128
      short_title: SAVE Act (Senate companion)
      watch_reason: Lee companion to H.R. 22; stalled.
    - bill_id: hr7296-119
      congress: 119
      type: hr
      number: 7296
      short_title: SAVE America Act
      watch_reason: Roy refile (Jan 2026).
    - bill_id: s3752-119
      congress: 119
      type: s
      number: 3752
      short_title: SAVE America Act
      watch_reason: Lee Senate refile (Jan 2026); the bill Trump is pressuring the Senate to pass.
    - bill_id: hr7300-119
      congress: 119
      type: hr
      number: 7300
      short_title: MEGA Act
      watch_reason: Make Elections Great Again; near-identical, CHA hearing Feb 2026.
    # ASSERTED, HUMAN-MAINTAINED FACT (not auto-detected): S. 1383 is the unrelated
    # bill the SAVE/proof-of-citizenship payload currently rides. The news collector
    # routes "procedural term + subject term" hits to this is_vehicle bill at C3.
    # WARNING: if the provisions move to a NEW vehicle, you must edit BOTH this
    # watchlist entry (move is_vehicle) AND keep subject_terms current by hand.
    # Nothing detects the switch -- if you don't, the news channel silently goes
    # quiet (it stops attaching the maneuver to any bill).
    - bill_id: s1383-119
      congress: 119
      type: s
      number: 1383
      is_vehicle: true
      watch_reason: Unrelated bill used as the vehicle; voting provisions passed House 218-213 as an amendment (Feb 11 2026).
  # Formal parliamentary phrases. These match bill_actions text precisely but almost
  # never appear in news headlines/summaries (verified: 0 of 539 live items).
  procedural_terms:
    - "amendment to"
    - "held until"
    - "floor calendar"
    - "discharge petition"
    - "rule vote"
    - "unanimous consent"
    - "motion to proceed"
    - "cloture"
  # News-register movement vocabulary. The news collector's second signal is the UNION
  # of procedural_terms + these. Curated to mean MOVEMENT (a bill acting/being acted on),
  # not mere topic mention -- bare "vote"/"voting" are deliberately excluded as too loose.
  # An item attaches to a bill only with a movement term AND a subject term (or a bill
  # number), so over-tagging unrelated reporting stays blocked.
  news_movement_terms:
    - "passed"
    - "passes"
    - "approved"
    - "adopted"
    - "adopts"
    - "blocked"
    - "stalled"
    - "filibuster"
    - "veto"
    - "signed into law"
    - "tucked into"
    - "attached to"
    - "added to"
    - "fast-track"
    - "tabled"
    - "advances"
    - "advanced"
  # Subject vocabulary for the news cross-reference (Session 2). DELIBERATELY NARROW
  # and concrete to avoid over-tagging unrelated reporting -- do NOT add loose terms
  # like "election integrity" or "voter fraud". The watchlist short_titles above are
  # merged into this list by the collector, so SAVE Act / SAVE America Act / MEGA Act
  # are covered without repeating them here.
  subject_terms:
    - "proof of citizenship"
    - "documentary proof"
    - "SAVE Act"
    - "SAVE America Act"
    - "noncitizen voting"

# ===========================================================================
# CORRELATION LAYER: curated event anchors  (export/snapshots.py)
# ===========================================================================
# The export layer groups same-event news into one per-bill timeline node.
# Grouping is HAND-MAINTAINED here, like the s1383 vehicle alias above -- there
# is no similarity threshold and no fuzzy/shared-token matching (the dedup note
# under `news.dedup` explains why: many outlets on one event is corroboration,
# not duplication, so the survivors are deliberately distinct and fuzzy title
# matching cannot regroup them). An anchor groups news items that are scoped to
# `bill`, fall inside `window` (inclusive, date-only), AND contain `phrase`.
# The window does the heavy lifting; the phrase disambiguates within it.
#
# Grouping is ADDITIVE and lossless: every item still appears exactly once, as a
# standalone entry or as a member of one cluster node. An un-anchored event stays
# a set of individual items -- an acceptable miss, never a wrong merge. Keep
# anchors narrow and non-overlapping (same discipline as subject_terms). When the
# vehicle changes, add the new anchor by hand; nothing detects the event for you.
event_anchors:
  - id: s1383-housing-hostage
    label: "Trump withholds housing-bill signing to pressure the SAVE America Act"
    bill: s1383-119
    phrase: housing            # str or list of str; any single match qualifies
    window: { start: "2026-06-24", end: "2026-06-25" }   # inclusive, date-only

# ===========================================================================
# CHANNEL 2: EXECUTIVE ACTION  (Federal Register API)
# ===========================================================================
executive:
  api:
    base: https://www.federalregister.gov/api/v1
    key_env: null                    # no key required
  # /documents.json?conditions[agencies][]=...&conditions[term]=...&conditions[publication_date][gte]=...
  # Confirm agency slugs against /api/v1/agencies on first run.
  since: "2025-01-01"                 # publication_date[gte] floor; bounds first-run backfill
                                      # to the election-EO / DOJ-voter-data era (FR archive spans decades).
  agencies:
    - election-assistance-commission
    - justice-department
    - homeland-security-department
  terms:
    - election
    - voter registration
    - voter roll
    - proof of citizenship
    - mail ballot
  default_grade: { source: A, info: "1" }

# ===========================================================================
# CHANNEL 3: LITIGATION  (CourtListener / RECAP, Free Law Project)
# ===========================================================================
litigation:
  api:
    base: https://www.courtlistener.com/api/rest/v4
    key_env: COURTLISTENER_TOKEN     # free token from a CourtListener account
  default_grade: { source: A, info: "1" }   # primary court record
  max_bootstrap_requests_per_run: 30   # request budget for full-history walks -- the rare
                                       # fallback for a docket whose entries we don't already
                                       # hold. The common no-mark case is a 1-request descending
                                       # probe (ungated); only full walks draw this down, and a
                                       # deferred walk resumes next run.
  status_refresh_hours: 20             # how stale `cases.status` may get before refresh_status()
                                       # re-reads it. `status` is written by the resolve path only,
                                       # so without this pass a case that terminates after its first
                                       # resolve reads `pending` forever -- 9 of 40 rows were stale
                                       # that way on 2026-08-10, all inside a four-week window
                                       # (tools/status_audit measures it).
                                       # 20 rather than 24 PINS the pass to one cron slot. The stamp
                                       # is written mid-run, so at 24h the boundary lands inside the
                                       # same slot's own run, minutes from where the previous run
                                       # stamped it: whether that run catches it depends on run-to-run
                                       # variation in when litigation reaches the pass (collector wall
                                       # clock measured 384-751s across five runs), and a miss walks
                                       # the refresh forward a 6h slot. At 20h the boundary sits ~4h
                                       # ahead of the slot, clear of any plausible variation, so the
                                       # same run each day sees the whole due set and the other three
                                       # see 0 -- a checkable standing invariant instead of a moving
                                       # target. Cost is firing every 24h instead of every ~30h: one
                                       # extra pass every few days, 24 requests each.
  max_status_refresh_per_run: 40       # ceiling on refresh requests per run. The refresh set is
                                       # NON-terminated rows only (24 today, 33 before the 08-10 pass
                                       # flipped nine) -- `terminated` is absorbing on the court's
                                       # clock, so a terminated row never needs re-reading and the set
                                       # shrinks as rows flip. At the gate above that is ~+24/day
                                       # against a ~170-200/day baseline, about +13%; one run a day
                                       # carries the whole pass and the other three draw nothing.
  # Which docket entries become A1 items (the timeline). case_entries keeps EVERY entry;
  # only these substantive types are promoted to items. The exclude list is required: a
  # "MOTION for Leave to Appear Pro Hac Vice" matches "motion" and routine pro-hac/appearance
  # orders match "order" -- without it the timeline fills with docket noise (this docket is
  # ~half notices of appearance / pro hac vice).
  substantive_entry_types:
    - complaint
    - motion
    - opposition
    - reply
    - order
    - opinion
    - memorandum
    - judgment
    - notice of appeal
    - stipulation
  excluded_entry_phrases:
    - pro hac vice
    - notice of appearance
    - certificate of disclosure
    - corporate affiliations
    - return of service
    - waiver of service
    - summons
  # Seed the case list from maintained trackers, then poll dockets for movement.
  seed_trackers:
    - name: UW State Democracy Research Initiative, DOJ voter-data suit tracker
      url: https://statedemocracy.law.wisc.edu/our-work/tracker-doj-lawsuits-seeking-states-sensitive-voter-data
      grade: { source: B, info: "2" }
    - name: States United, Roll Calls
      url: https://statesunited.org/roll-calls/
      grade: { source: B, info: "2" }
    - name: Democracy Docket, cases
      url: https://www.democracydocket.com/cases/
      grade: { source: B, info: "2" }
  # Hand-seeds for the suits the UW tracker footnotes as RELATED but does NOT track
  # (footnote 1: Common Cause and LWV). The tracker's own main table -- the ~31 DOJ
  # voter-data suits, incl. the California/Weber row (ca9 / 26-1232) -- is supplied by
  # collectors.tracker_uw as data/doj_cases.json and loaded by litigation.main(). Clean
  # split, no overlap: config seed_cases = the footnoted related suits, artifact = the
  # tracker table. (Weber was dropped here; it is the tracker's California row now.)
  #
  # SECOND ROLE, added 2026-08-14, with its exit condition: config may also carry a
  # CIRCUIT SUCCESSOR THE TRACKER DEMONSTRABLY TRAILS. Each such entry names its
  # district predecessor and carries a dated justification, because bending the split
  # above needs a reason a later reader can check rather than take on faith.
  #
  # IT SELF-NEUTRALIZES, which is why this is a bend and not a fork. litigation.main()
  # iterates `config_seeds + tracker_seeds` (litigation.py:681), so the tracker is the
  # LAST writer; `cases.case_id` is the CourtListener docket id, so a config seed and a
  # future artifact row for the same docket are one PK and one row, not two. When UW
  # rewrites the state row, its values simply overwrite -- and because these entries use
  # UW's own spelling (`Second Circuit` / `ca2`, matching all 14 existing circuit rows),
  # the overwrite is byte-identical and the reuse lookup HITS, so not even a resolve is
  # spent. Removal after that is tidiness, not correctness. The only standing cost is
  # that a doubly-listed docket is polled twice per run: ~2 extra requests per run,
  # ~8/day, against a measured 1,000/hour. Accepted deliberately.
  #
  # THE JOIN KEY'S SPELLING IS LOAD-BEARING. The reuse lookup is
  # `WHERE docket_number = ? AND court = ?` on the seed's FREE-TEXT `court`, never
  # `court_id`, so a seed reading `2nd Cir.` here would miss the artifact's
  # `Second Circuit` later and spend a needless resolve. Match UW's string exactly.
  seed_cases:
    - caption: Common Cause v. U.S. Department of Justice
      docket_number: 1:26-cv-01352
      court: D.D.C.
      court_id: dcd                   # CourtListener court id, for exact docket_number+court resolution
      category: voter-data
      notes: Challenges the DOJ master voter database under the Privacy Act and APA.
    - caption: League of Women Voters v. U.S. Department of Homeland Security
      docket_number: 1:25-cv-03501
      court: D.D.C.
      court_id: dcd
      category: voter-data
      notes: Alleges DHS turned SAVE into a national citizenship database.
    # The D.C. Circuit appeal of the row above. Same shape as CT/NY -- a successor
    # psephos lacked -- but the WAIT QUESTION THAT JUSTIFIED THOSE TWO DOES NOT
    # APPLY HERE, and that is the whole reason this is seeded rather than deferred.
    # CT/NY rested on a measured tracker lag: UW rewrote VA and NM within 4-5 days
    # and had left those two for 22. There is no such argument to make about this
    # one, because the UW tracker NEVER carries it -- 1:25-cv-03501 is a config seed
    # against federal agencies and appears nowhere in data/doj_cases.json. Waiting
    # for a rewrite would be waiting for an event that cannot occur, so recency is
    # not the test; it is 48 days old regardless.
    # A1 evidence, from the terminated predecessor's own record: entry 2026-06-29 on
    # 71499795 reads `USCA Case Number 26-5243 for 113 Notice of Appeal to DC
    # Circuit Court`. Circuit map: D.D.C. appeals lie to the D.C. Circuit.
    # No `state`, matching its predecessor -- these sue federal agencies and belong
    # to no jurisdiction, so both stay off the /campaign grid by construction.
    - caption: League of Women Voters v. U.S. Department of Homeland Security (D.C. Cir.)
      docket_number: 26-5243
      court: D.C. Circuit
      court_id: cadc
      category: voter-data
      notes: >-
        D.C. Circuit appeal of the D.D.C. dismissal in 1:25-cv-03501 (case_id
        71499795, terminated), which names it in its 2026-06-29 entry. Seeded
        2026-08-16; permanent, because the UW tracker carries neither this case nor
        its predecessor.

    # --- circuit successors the tracker trails (the second role above) -------
    # THE ANOMALY, dated 2026-08-14 and measured rather than asserted. DOJ noticed
    # both appeals on 2026-07-23 and ca2 docketed both on 07-28. The controls are
    # the contemporaries: Virginia noticed 07-24 and New Mexico 07-23, and UW had
    # rewritten BOTH state rows to their circuit dockets by ~07-27/28 -- 4-5 days.
    # These two were noticed in the same week and are still un-rewritten 22 days
    # later, so the artifact keeps pointing at terminated district dockets and the
    # collector, which polls only what the artifact names, cannot reach the appeals.
    #
    # The notes field is NOT a leading indicator and was checked before relying on
    # one: VA and NM carry the identical "DOJ filed a notice that it will appeal"
    # sentence AFTER their rewrite, so it is a narrative log, not a state machine.
    # That is why the justification here rests on the skipped-contemporaries
    # comparison instead. Remove these two entries once UW rewrites the rows.
    - caption: United States of America v. Thomas
      docket_number: 26-2064
      court: Second Circuit         # UW's spelling, verbatim -- see the join-key note above
      court_id: ca2
      category: voter-data
      state: Connecticut            # a state case, unlike the two federal-defendant seeds
      notes: >-
        Second Circuit appeal of the D. Conn. dismissal in 3:26-cv-00021 (case_id
        72110170, terminated). Noticed 2026-07-23, docketed 2026-07-28. Seeded here
        2026-08-14 because the UW tracker still lists the district docket; remove when
        it rewrites the Connecticut row.
    - caption: United States of America v. Board Of Elections of the State of New York
      docket_number: 26-2060
      court: Second Circuit
      court_id: ca2
      category: voter-data
      state: New York
      notes: >-
        Second Circuit appeal of the N.D.N.Y. dismissal in 1:25-cv-01338 (case_id
        71457474, terminated). Noticed 2026-07-23, transmitted to the court of appeals
        07-27, docketed 2026-07-28. Seeded here 2026-08-14 because the UW tracker still
        lists the district docket; remove when it rewrites the New York row.

    # --- district ORIGINALS behind circuit rows we hold (the FIRST role) ------
    # THE OPPOSITE DIRECTION FROM THE TWO ABOVE, and the difference decides whether
    # these entries are temporary. CT/NY are successors the tracker has not caught
    # up to yet, so they carry "remove when it rewrites". These three are
    # PREDECESSORS: the tracker has ALREADY moved each state to its Ninth Circuit
    # docket (data/doj_cases.json holds 26-1232 / 26-1231 / 26-3609 at court
    # "Ninth Circuit"), and it will never carry the district original again. So
    # they are permanent seeds for cases the artifact does not cover -- the same
    # category as the two federal-defendant seeds above, not the amended second
    # role. There is no duplicate poll: no artifact row shares these dockets.
    #
    # EVIDENCE, two instruments differing in kind, per row rather than shared.
    # A1: each district docket is named in its OWN circuit row's CourtListener
    # entry ("CASE OPENED. A copy of your notice of appeal / petition filed in
    # <docket> has been received..."), so the cross-reference runs from the record
    # psephos already holds. B2: each state's tracker note carries its own
    # "Key decisions: District Court's <date> dismissal". The AZ note's line about
    # the 9th Circuit staying DOJ's appeal pending CA and OR is about the APPEALS
    # and was deliberately not read as covering the other two.
    #
    # Docket form: seeded bare, as the audit extracts them and as the circuit rows
    # are stored. The entries name them with judge initials appended
    # (2:25-cv-09149-DOC-ADS); if a resolve misses, that fuller string is the
    # fallback and is preserved in the entry text.
    - caption: United States of America v. Weber, et al. (C.D. Cal.)
      docket_number: 2:25-cv-09149
      court: Central District of California
      court_id: cacd
      category: voter-data
      state: California
      notes: >-
        District original behind the Ninth Circuit appeal 26-1232 (case_id 72356732),
        which names it in its 2026-03-03 CASE OPENED entry. Tracker records the
        District Court's 1/15/26 dismissal. Seeded 2026-08-16; permanent, because the
        artifact carries this state at its circuit docket and never at this one.
    # PINNED, and the only pinned seed. CourtListener holds TWO records for this
    # docket number in `ord`, so the exact-match resolve can never return one and
    # correctly refuses to bind. The pin is per-seed and carries its evidence; the
    # refusal stays exactly as strict everywhere else, because a global relaxation
    # would trade one loud refusal for a silent arbitrary bind on every future
    # collision. Both instruments, measured 2026-08-16 and differing in kind:
    #   71363789 -- date_terminated 2026-02-05, matching the tracker's "District
    #               Court's 2/5/26 dismissal" to the day, AND carries the real
    #               docket entries (#78, filed 2026-03-12).
    #   71956700 -- no termination date and NO entries at all; binding here would
    #               have produced a permanently empty row that polls forever.
    # Checked project-wide when this was found: zero rows show the bound-but-empty
    # signature (entries_synced_at set, no case_entries), so this is a one-off
    # rather than a class.
    - caption: United States of America v. State of Oregon, et al. (D. Or.)
      docket_number: 6:25-cv-01666
      court: District of Oregon
      court_id: ord
      case_id: '71363789'
      category: voter-data
      state: Oregon
      notes: >-
        District original behind the Ninth Circuit appeal 26-1231 (case_id 72356772),
        which names it in its 2026-03-03 CASE OPENED entry. Tracker records the
        District Court's 2/5/26 dismissal. Seeded 2026-08-16; permanent, for the same
        reason as the California entry above. CourtListener id pinned -- see above.
    - caption: United States of America v. Fontes (D. Ariz.)
      docket_number: 2:26-cv-00066
      court: District of Arizona
      court_id: azd
      category: voter-data
      state: Arizona
      notes: >-
        District original behind the Ninth Circuit appeal 26-3609 (case_id 73443024),
        which names it in its 2026-06-04 CASE OPENED entry. Tracker records the
        District Court's 4/28/26 dismissal, and separately that the 9th Circuit stayed
        this appeal on 6/22/26 pending CA and OR. Seeded 2026-08-16; permanent.

# ===========================================================================
# CHANNEL 4: ADMINISTRATIVE COERCION + NEWS  (RSS + Google News)
# ===========================================================================
# The demand letters and funding threats are not in any structured feed.
# They surface here first, then become dockets in Channel 3 once a state resists.
news:
  feeds:                                            # URLs fetched live, entry counts > 0
    - id: votebeat
      url: https://www.votebeat.org/arc/outboundfeeds/rss/?outputType=xml   # Arc XP feed path
      grade: { source: B, info: "2" }
    - id: democracy-docket
      url: https://www.democracydocket.com/news-alerts/feed/   # canonical, full content, 10 entries (Substack mirror returned only 2)
      grade: { source: B, info: "2" }
    - id: bolts
      url: https://boltsmag.org/feed/
      grade: { source: B, info: "2" }
    - id: states-united
      url: https://statesunited.org/feed/
      grade: { source: B, info: "2" }
  google_news:
    base: https://news.google.com/rss/search
    queries:
      - "SAVE America Act"
      - "proof of citizenship voting"
      - "DOJ voter rolls"
      - "voter data lawsuit"
      - "election executive order"
      - "voter roll federal funding"
    grade: { source: C, info: "3" }    # aggregated; corroborate before promoting an item
  dedup:
    stage1: canonical_url              # strip utm_*, fragments, trailing slash, then exact-match
    stage2: title_norm                 # sha256 over normalized title + lede; fuzzy match near-dupes
    near_dupe_threshold: 0.90          # rapidfuzz token_sort_ratio over normalized titles
    # Do NOT lower this: many outlets covering one event is corroboration, not duplication;
    # collapsing them destroys the multi-source signal. Event-grouping is a timeline-layer job.

# ===========================================================================
# CHANNEL 5: STATE LEGISLATION  (LegiScan API)
# ===========================================================================
# State bills are first-class (5b-a): each getBill fills a state_bills dimension
# row and stamps items.state_bill_id, exported as per-bill timelines in
# data/state_bills.json. bill_id/case_id stay null. The change-hash pattern is
# the whole game -- one getMasterList per state per run, then getBill ONLY on
# election bills whose change_hash moved, so the free-tier 30k queries/month cap
# is never at risk. See collectors/state.py and the state_seen table.
state:
  api:
    base: https://api.legiscan.com/
    key_env: LEGISCAN_API_KEY          # free key: https://legiscan.com/legiscan
  states: [TX, GA, FL, AZ, WI, PA, MI, NC, OH]   # start focused; the change-hash
                                                 # pattern scales to all 50 if wanted
  terms:                              # word-boundary phrase filter (see election_match).
                                      # Recall MEASURED against a nine-state masterlist corpus
                                      # (handoff 9, tools/masterlist_corpus.py), not assumed.
                                      # Bare `election` stays OUT: +569 bills at ~55% precision,
                                      # the actual flood -- ad-valorem-tax/bond-referendum
                                      # elections, legislative-officer elections (e.g. "election
                                      # of the assistant minority leader"), pension/corporate-tax
                                      # "elections". Bare `ballot` stays OUT too: +106 at ~65% --
                                      # tax propositions and corporate ballot-issue spending.
                                      # Bare `voter`/`voting` ARE kept (~80-85% real: voter
                                      # fraud/eligibility/registration, restoration of voting
                                      # rights, voting machines, ranked-choice); their residual
                                      # noise is redacted by exclude_terms below rather than
                                      # thrown away with the signal. Some phrases (voter
                                      # registration, early voting) are subsumed by the bares;
                                      # kept for explicit coverage if a bare is ever pruned.
                                      # PLURAL RULE (handoff 12): a PHRASE term (one with a
                                      # space) tolerates a plural on its last word --
                                      # `election official` also matches `election officials`.
                                      # Measured +19 bills at ~95% precision (election official
                                      # +11, primary election +5, election audit +2, mail ballot
                                      # +1); the other phrase terms add nothing, so the rule is
                                      # free to apply broadly. BARE `voter` is deliberately NOT
                                      # pluralized: `voters` adds 56 at ~45% (bond-referral
                                      # "submitted to the voters", daylight-time referenda,
                                      # League of Women Voters resolutions) -- measured, not
                                      # assumed. The predicate is the space, not a whitelist, so
                                      # any new phrase term inherits the tolerance. See
                                      # collectors/state.py::_term_pattern.
    - voter
    - voting
    - voter registration
    - voter roll
    - proof of citizenship
    - mail ballot
    - absentee
    - provisional ballot
    - same-day registration
    - voter id
    - redistricting
    - voted by mail
    - early voting
    - primary election
    - election audit
    - poll watcher
    - ballot drop
    - election official
    - canvass
    - signature verification
                                      # INVERTED / adjective+token voter constructions,
                                      # adopted on measured recall (handoff 12 Part C):
                                      # +10 genuine bills at 100% precision over the corpus,
                                      # no bare token, all phrases. The phrase plural rule
                                      # applies but is a NO-OP here -- they are already
                                      # plural, so the trailing (?:es|s)? is dead alternation,
                                      # harmless, not intentional. WATCH `registered voters`
                                      # and `eligible voters`: the most generic surface forms
                                      # (adjective + token), the likeliest to pick up bond/tax
                                      # language if the corpus moves ("a majority of registered
                                      # voters" is a plausible construction, just absent today).
                                      # Zero noise is MEASURED, not assumed; the bond/tax flood
                                      # negatives are pinned in test_state.py so a corpus shift
                                      # that breaks this trips a test rather than leaking silently.
    - registration of voters          # inverted `voter registration`; does NOT match
                                       # "of registering voters" (TX HB509, noise) -- tested
    - registered voters               # WATCH: generic adjective+token
    - eligible voters                 # WATCH: generic adjective+token
    - provided to voters              # "information provided to voters" (ballot-measure info)
  exclude_terms:                      # REDACTED from title+description before matching (see
                                      # election_match), so a bill matching ONLY via one of these
                                      # drops, while one also carrying a real term survives:
                                      # "voter approval of early voting" keeps on "early voting",
                                      # a bare "voter-approval tax rate" does not. Hyphen-aware:
                                      # "voter-approval" and "voter approval" both redact. Each is
                                      # named from the corpus noise it removes (34 bills at the
                                      # measured list; every one tax/bond/HOA/proxy, zero real).
                                      # Plural-tolerant on the last word too (handoff 12),
                                      # symmetric with terms: "voter approvals" redacts like
                                      # "voter approval". No corpus effect today; closes the
                                      # asymmetry before the corpus moves.
    - voter approval                  # TX tax term of art: ad-valorem/bond tax-rate elections
    - proxy voting                    # precinct-committee / corporate proxy voting
    - cumulative voting               # HOA / corporate cumulative voting
  max_getbill_per_run: 500        # budget guard; change-hash resumes next run if hit
  default_grade: { source: B, info: "2" }   # LegiScan is a maintained aggregator (spec's B2 tier)
