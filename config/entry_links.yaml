# Tier-2 links: two CourtListener objects that describe one minute entry (R1, Corey's
# rulings of 2026-09-30, ruling 3; docs/status.md, "Duplicate rows, R1").
#
# No upstream field links them, so every link is PSEPHOS'S ASSERTION, recorded on the
# object (`cl_entries.twin_of`, `twin_rule`, `twin_at`), naming what made it, and
# reversible (`python -m scripts.link_entry_twins --unlink <cl_entry_id>`).
#
# `rule` makes the links for pairs a LATER POLL held in one collector run
# (collectors/cl_twins.py, the D0's strict-B). Pairs held in different runs, pairs whose
# run cannot be told, and pairs the docket's first load may have held (Corey, 2026-10-02:
# that load fetched the whole docket at once, so its run tells nothing) go to a person and
# are linked only when listed under `asserted`.
#
# Rows are named by case_entries id: rows and ids are kept (R1), so a row id names the
# same text for good, where a CourtListener id is known only after the id backfill.
rule: same-run strict-B v1

# Nothing is applied until the class of 13 and the two individual splits are ruled. Then
# everything ruled is applied together with the read links below, in one move with its own
# dated note (Corey's rulings of 2026-10-03, R1 plans and splits, ruling 5).
# link_entry_twins --apply refuses while `hold` is set. Kept on when the D.N.H. halves were
# ruled the same day (a ruling as evidence, ruling 3), and when Corey read his ten the same
# day, all same: the ten pass his check (docs/findings/r1-corey-ten-2026-10-03.md).
hold: "until the class of 13 and the two individual splits are ruled (R1 plans and splits, ruling 5; Corey's ten read 2026-10-03, all same)"

# The reader's check of the rule's pairs, recorded before the rule is relied on.
# link_entry_twins --apply refuses unless `result` is pass and the check still describes
# the rule's pool: a full read names every pair in it, a sample is what its seed redraws.
#
# 2026-10-03: a BLIND FULL READ of the rule's 7 pairs, PASS (Corey's rulings of 2026-10-03,
# ruling 3c). Each reader started from tools/reader_launcher.txt rendered for its lens and
# its file, launched by the Agent tool, and every reader passed tools/reader_launch.py's
# check. Each file held one pair, named by its content hash, with the pair's own link
# hidden. All 21 reads were yes and none named a better match. The record is
# docs/reads/2026-10-03-blind-links.json; docs/findings/r1-blind-reads-2026-10-03.md.
checked:
  full: true
  seed: null
  pool: 7
  pairs: [[5677, 5689], [12886, 12894], [17161, 17167], [57249, 57258], [67589, 67651],
          [77471, 77602], [87130, 87131]]
  walks_through: "2026-10-01T06:13:55.897859+00:00"
  result: pass
  bar: "pass = all three readers read one minute entry and none names a better match (set before the 2026-10-01 read)"
  read_by: "three readers per pair, lenses identity / alternative match / clocks, launched blind (launcher sha256 b6f45a4c2975, docs/reads/2026-10-03-blind-links.json)"
  on: "2026-10-03"

