# Rulings: evidence the script accepts in place of a read (Corey's rulings of 2026-10-03, a
# ruling as evidence, ruling 1). Each ruled entry says who ruled (`by`), the `date`, the
# `criterion` in one sentence, the exact `links` it covers by row ids, each [twin, root] and
# each a read link above, and the `reads` it stands over: run records in docs/reads/, every
# link it names read in one of them. A read link that its run read but did not pass links
# when a ruled entry names it and stands over that run, and its twin_rule names the ruling.
# In a shared group every link needs a passing read or a ruled entry naming it; anything
# else refuses the group whole. A ruled entry is refused, and --apply with it, when it does
# not say who ruled, when and by what criterion, names no reads, a read with no run record
# or no links, or names a link it does not cover or one no read link carries.
#
# None yet: the class of 13 and the two individual splits wait for Corey's line.
ruled: []
