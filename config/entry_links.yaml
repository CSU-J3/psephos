# order, the root being the long form of a pair the rule makes and the docket text of a
# plan (ruling 2 of 2026-09-30); kind: the rule's own kind when the rule makes the pair,
# else plan; read: the run record in docs/reads/ that passed it, and the link's label
# there. Write them with `python -m scripts.link_entry_twins --write`, which sets that
# order; --apply refuses an entry recorded the other way (the direction check,
# 2026-10-03). --apply links one only when that run passed tools/reader_launch.py's check
# under the stored launcher and read the link unanimous, or read it and a ruled entry
# (`ruled`, below) names it and stands over that run.
