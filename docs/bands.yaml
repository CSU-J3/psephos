# docs/bands.yaml -- the observed band edges, declared once.
#
# CONSEQUENCE FIRST: every declared range is NARROWER than the real one, so a `none`
# (no-opportunity) classification can be wrong in the QUIET direction -- a real landing
# may fall outside the range the tool checks -- while the refusal branch catches only the
# LOUD case, a slot that meets the checked range and has no recorded row.
#
# WHY THIS EXISTS. The fire range and the commit-lag band were carried as literals in
# tools/window_table.py, in collect.yml's comment and across docs/status.md, and every
# move meant finding every copy. This is the one place an edge is written. The tool
# reads it; the landing range is DERIVED from it (near = fire near + commit near, far =
# fire far + commit far) and is never typed anywhere.
#
# Each edge carries its value, the sample count behind the band as of the move, what set
# it, the date it last moved, which way it can be wrong (`error`), and how many of its
# samples are UNCENSORED (`n_uncensored`) beside the total `n`. Durations are `XhYYmZZs`
# or `YmZZs`.
#
# DIRECTION OF ERROR. An observed near edge can only sit AT OR ABOVE the true near edge,
# and an observed far edge AT OR BELOW the true far edge, so each declared band is a
# SUBSET of the real range, never a superset, and the derived landing range inherits
# that. Two causes stack on the fire edges -- sampling, and the counted era's censoring --
# and one applies to the commit-lag edges: sampling only, since commit lag is measured
# within a single run and never needs a slot assignment.
#
# AND THE SCHEME ASSUMES ONE CAUSE PER EDGE, WHICH ONE EDGE BREAKS. `wall_clock.far`
# carries two causes pushing OPPOSITE WAYS -- sampling understates a maximum, the
# `updatedAt` lag overstates every sample -- and the run record cannot separate them. It
# is declared `bound: unsigned` and is the only edge in this file that cannot be signed.
# Anything computed from it inherits that: `tools.window_table` prints a figure as signed
# only when every input pushes the same way.
#
# THESE BANDS ARE NOT CONVERGING. At the twelfth commit-lag sample, three of the last
# seven had broken an edge -- 61b8517 (24m22s, 09-13), dd3af8c (6m19s, 09-14) and a627ac3
# (5m55s, 09-15, applied when P2 closed); with the thirteenth, 222a4d3 at 11m59s, it is two
# of the last seven, 61b8517 having aged out of the seven -- and the fire range's far edge has moved three times since
# 09-07 (4h42m to 5h04m25s, to 5h08m40s on 09-09, to 5h37m52s on 09-13). Every
# classification tools.window_table makes is provisional on constants that are still
# walking. Both fire edges are also CENSORED readings of the true spread: the counted
# era's assignability rule excluded exactly the runs that could have extended either
# end (09-07 12:36:16Z reads 19m16s or 6h19m16s; 09-14 12:50:51Z reads 33m51s or
# 6h33m51s), so the near edge may sit too high and the far edge too low.

# TWO DERIVED FAR EDGES, AND THEY ARE NOT INTERCHANGEABLE (added 2026-09-17). Both are
# computed in tools/window_table.py and typed nowhere. `landing_far` = fire.far +
# commit_lag.far answers WHEN A DATA COMMIT LANDS, which happens mid-run. `heartbeat_far`
# = fire.far + wall_clock.far answers WHEN THE RUN ENDS, which is when a heartbeat row is
# written. The 09-13 06:17Z run, 34755670262, is why both exist: it set BOTH of
# landing_far's inputs, so the largest observed slot-to-commit equals landing_far to the
# second, while that same run's slot-to-run-end is 6h02m20s -- six seconds PAST
# landing_far and eight seconds under heartbeat_far. A staleness check wired to
# landing_far would have called that healthy run missed.
#
# THEIR BOUNDS DIFFER, which is the cost of measuring the right event. landing_far sums
# two `lower` edges and is a clean lower bound. heartbeat_far sums fire.far (`lower`) with
# wall_clock.far (`unsigned`), so it is UNSIGNED -- this file's rule applied, a figure
# being signed only when every input pushes the same way. For the staleness use the
# unsignable half is benign in the direction that matters: the updatedAt lag overstates
# every wall-clock sample, pushing the edge later, away from calling a live run missed.
# Sampling pushes the other way, and the run record cannot separate them, which is why
# the figure is still not signed.

fire:  # run_started_at minus the slot
  near:
    value: 2h05m29s
    n: 38  # counted era on `17 */6`, 09-04 06:17Z to 09-14 12:17Z: 40 runs less 2 excluded outright; 28 of the 40 are unassignable under the strict reading, so 38 is not a face-value count
    n_uncensored: 4  # labelled era: 09-15 00:17Z, 06:17Z, 12:17Z, 18:17Z, each naming its own slot
    error: "upper bound on the true near edge: sampling, plus censoring (09-07 12:36:16Z and 09-14 12:50:51Z could read 19m16s and 33m51s, below it)"
    bound: upper   # the observed value sits AT OR ABOVE the true one
    set_by: "run 33989910962, the 09-05 18:17Z slot, started 20:22:29Z (first written into the record 2026-09-09)"
    moved: 2026-09-05
  far:
    value: 5h37m52s
    n: 38  # the same counted-era figure as the near edge, with the same caveat
    n_uncensored: 4  # labelled era, all firing 3h00m22s to 5h23m27s, so none constrains this edge
    error: "lower bound on the true far edge: sampling, plus censoring (the same two excluded runs could read 6h19m16s and 6h33m51s, above it)"
    bound: lower   # the observed value sits AT OR BELOW the true one
    set_by: "run 34755670262, the 09-13 06:17Z slot, started 11:54:52Z"
    moved: 2026-09-13

commit_lag:  # data commit time minus run_started_at, committing runs only
  near:
    value: 5m38s
    n: 14
    n_uncensored: 14  # commit lag needs no slot assignment, so no sample is censored
    error: "upper bound on the true minimum: sampling only"
    bound: upper
    set_by: "fedde82, run 35151323003 (collect 17 18 * * *), started 21:15:13Z on 09-16. Previous edges 5m55s (a627ac3, 09-15) and 6m19s (dd3af8c, 09-14)"
    moved: 2026-09-17
  far:
    value: 24m22s
    n: 14
    n_uncensored: 14  # commit lag needs no slot assignment, so no sample is censored
    error: "lower bound on the true maximum: sampling only"
    bound: lower
    set_by: "61b8517, run 34755670262, started 11:54:52Z on 09-13"
    moved: 2026-09-13

wall_clock:  # updatedAt minus startedAt, scheduled runs only
  # THE FIELD THIS BAND IS MEASURED ON IS NOT COMPLETION. `updatedAt` is the run's LAST
  # UPDATE, which is at or after the moment it finished; nothing in the run record
  # reports completion directly. So every sample here is a wall clock PLUS whatever lag
  # that field carries, and the far edge inherits it -- see its `bound`.
  measured_on: "updatedAt - startedAt"
  updated_at_limit: "updatedAt is the record's last update, not completion, so every sample is an overstatement of unknown size"
  near:
    value: 5m06s
    n: 47  # scheduled runs since `58c6aca` (2026-09-04 02:11Z), all `success`, no dispatches in the span
    n_uncensored: 47  # wall clock needs no slot assignment, so BOTH fire-range exclusions are sampled here
    error: "upper bound on the true minimum: sampling, plus the updatedAt lag, both pushing high"
    bound: upper
    set_by: "run 33989910962, the 09-05 18:17Z slot, started 20:22:29Z -- the same run that set the fire range's near edge"
    sampled: 2026-09-05
    first_declared: 2026-09-16
    moved: 2026-09-05
  far:
    value: 32m27s
    n: 47
    n_uncensored: 47
    error: "INDETERMINATE: sampling makes it a lower bound on the true maximum, the updatedAt lag makes it an overstatement, and the run record cannot separate them"
    bound: unsigned   # the only unsignable edge in this file
    set_by: "run 34122774777, the 09-07 12:17Z slot, started 12:36:16Z -- one of the two runs the fire range excludes, sampled here because wall clock needs no slot"
    sampled: 2026-09-07
    first_declared: 2026-09-16
    moved: 2026-09-07

# THE MIDDLE OF A RANGE IS DELIBERATELY UNPRICED, and this line exists so a later
# session does not propose it again. A median fire lag would be the obvious third
# number, and it fails this file's own standard three ways: it derives from the 41 rows
# the file refuses to hold, it has no `set_by` a reader can open, and it moves on nearly
# every sample -- off a set whose two tails are both censored. Declared edges are
# extremes with provenance; a summary statistic is neither. Its value belongs in a
# session report, dated, and not here.
