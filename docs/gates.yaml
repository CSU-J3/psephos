# docs/gates.yaml -- the claim register for the "Where this stands" section.
#
# WHY THIS FILE EXISTS. The section states things about the world. Some of them
# are read out of the record every render and cannot go stale without the record
# going stale first; some of them are editorial claims sourced to reporting, and
# those rot silently. This file is where the second kind carries its source and
# its expiry, and where the first kind is forbidden from carrying a value at all.
#
# TWO SHAPES, and the difference is the whole point (recon section 6).
#
#   authored -- an editorial claim. Carries grade, source, the date the SOURCE
#               said it, an expiry, and what would falsify it.
#   derived  -- a figure read from the record. Carries `produced_by` and
#               `renders_as` and NO NUMBER. A derived entry holding a literal is
#               the rot this file exists to end: 25, 12 and 46 all rotted in this
#               repo while looking maintained, because they were written down.
#
# ENFORCEMENT is `web/scripts/assert-gates.mjs`, four checks, two entry points:
#
#   1. every `data-gate` id in the rendered section has an entry here
#   2. every entry here with `renders_as` has its id on a `data-gate` in the rendered
#      section -- a join on gate ID. The `renders_as` text is not compared.
#   3. every authored entry's `recheck_after` is not in the past
#   4. every docket an authored entry lists in `record_instruments` is held in
#      data/cases.json, or is a pinned seed not yet bound while the record's clock
#      is on or before the entry's `record_instruments_due` (2026-09-28)
#
# `aliases` carries the ids an entry was known by before a rename; the checks that
# resolve ids resolve an alias to its entry. Records in docs/status.md keep the id
# they were written with.
#
# Beside 1 and 2, a `data-gate-ref` is a POINTER to an authored entry, for text that
# names a claim without restating it (tab 2's "In force today"). It has no entry of
# its own; the join fails a pointer whose target is unregistered, derived,
# falsified, or absent from the section.
#
# `renders_as` documents the text the gated element renders, and nothing checks
# it yet.
#
# 1 and 2 join against the DOM and are hand-run beside assert-encodings and
# assert-layout. 3 and 4 need no browser and run in ci.yml (`--expiry-only`); the full
# run in the DOM lane executes all four. See that script's header.
#
# `status: stale` IS AN ACKNOWLEDGEMENT, NOT A SUPPRESSION. It stops check 3
# failing the run, and it changes nothing on the page by itself. A chip is fixed
# text carrying its recheck date; nothing reads a date or a status at render time.
# A stale gate renders grey only because its chip in WhereThisStands.tsx carries
# the `rk stale` class, typed by hand when a person marks the gate stale, so the
# class and this field must be kept in step by that person. The grey is the
# reader's signal and it is never silenced. What `stale` says is "a human has seen
# that this is past due and has not yet rechecked it". What fires ON the date is
# check 3 (`--expiry-only` in ci.yml), on the gate id, at the next human push.
#
# THE EXPIRY CHECKS ARE ONLY AS LIVE AS THE COLLECT LANE (Corey, 2026-09-28). Checks 3
# and 4 read the RECORD's clock, `data/generated_at.json` -- MAX(items.fetched_at),
# which only collect.yml's data commit moves -- never the wall clock. When collect stops
# running, that clock freezes: no `recheck_after` and no `record_instruments_due` comes
# due again, in ci.yml or in the DOM lane, and a claim the world has moved past keeps
# reading current. Nothing in this file or its checks can notice that. What alarms on it
# is `coverage_audit` section 8, the dead-lane alarm (tools/coverage_audit.py, run daily
# by audit.yml): it fires when no collect run has written a `channel_runs` row for over
# 24h, and its issue is the signal that these dates have stopped moving.
#
# AND DO NOT BACKDATE A RECHECK TO DODGE THE GREY. `doj-demands-all-51` below
# ships grey on its first render, carrying an `asserted_on` from ~Sep 2025,
# because that is when the reporting behind it was published. Moving the date
# would make the file lie in exactly the direction it was built to prevent.
#
# recheck_after defaults by grade, per recon section 7.5, as starting numbers to
# be adjusted rather than a law: C3 30 days, B2 90 days, statutes 365 days.

