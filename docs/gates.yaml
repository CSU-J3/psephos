# THE D.D.C. INJUNCTION OF SEP 13, ADDED 2026-09-28 on a finding (docs/status.md, *The
# EO 14399 dockets*): a second court's order on the rule, broader than the D. Mass. one
# below, sat unread on a docket the unit was about to seed. Judge Nichols's order in the
# three consolidated D.D.C. suits (1:26-cv-01114 ECF 193, captioned in 01114, 01132 and
# 01151): "ORDERED that the United States Postal Service is preliminarily enjoined from
# implementing and enforcing the Final Rule it published on August 21, see Ballot Mail
# for Federal Elections, 91 Fed. Reg. 54,966 (Aug. 26, 2026)." It grants the LULAC
# (ECF 171) and NAACP (ECF 172) renewed motions and DSCC's (ECF 163) in part; fn. 1: "The
# Court denies only the portion of the Motion that seeks to preliminarily enjoin Section
# 3 of the Executive Order." The memorandum opinion (ECF 192), Part D, holds the scope to
# CASA: "Enjoining Federal Defendants from enforcing the Rule, in its entirety, is
# therefore a 'party-specific' remedy consistent with CASA's command", the plaintiff
# organizations having members who vote by mail in essentially all fifty states. The
# decree names no end date and no election, so it is broader than the D. Mass. order on
# both axes, and the page renders it first (Corey, 2026-09-28).
#
# THE FALSIFIER'S INSTRUMENT IS THE D.D.C. DOCKET, 1:26-cv-01114 (CourtListener
# 73131864), read directly: an appeal is noticed there first, and a stay pending appeal is
# sought there first. As read 2026-09-28 (RECAP, which lags PACER), its last entry is a
# Sep 23 minute order admitting counsel pro hac vice, its last party filing the
# government's Sep 22 notice of a State Department records notice, and it carries NO
# NOTICE OF APPEAL FROM ECF 193. Its one notice of appeal, ECF 146 of Jun 1, is the
# appeal from the May 28 denial that became 26-5193 (affirmed Jul 28, mandate Sep 18).
# The government's 60-day window (FRAP 4(a)(1)(B)) runs to Nov 12. That is transient
# procedural state, so it lives here and in the recheck, never on the page.
#
# THE RECHECK, 2026-10-15, ruled 2026-09-28 (Corey) rather than defaulted: mid-window,
# 19 days before the election, and the same day as the D. Mass. entry below, so one
# reading covers both orders on the rule. THE NEXT RECHECK IS NOV 12, the close of the
# government's appeal window.
#
# THE RENDERED SPAN KEEPS SECTION 3 OUT. The decree names no section of the order, and
# its fn. 1 denies the motion as to section 3. So the span says the rule was issued "at
# EO 14399's direction", which cannot be read as section 3 enjoined.
#
# "AT EO 14399'S DIRECTION" TRACES TO THIS GATE'S OWN SOURCE, ECF 192 (Corey's ruling 1b,
# 2026-09-28: the phrase sits inside the gated span, so it must). The memorandum opinion's
# background, p. 2: "Section 3 of the Executive Order directed the United States Postal
# Service to initiate a proposed rulemaking". P. 3: "On June 2, 2026, the Postal Service
# issued a Notice of Proposed Rulemaking as directed by the Executive Order, see Ballot
# Mail for Federal Elections, 91 Fed. Reg. 32,915 (June 2, 2026), and after receiving more
# than 200,000 comments, it published a Final Rule on August 21, see Ballot Mail for
# Federal Elections, 91 Fed. Reg. 54,966 (Aug. 26, 2026)". And p. 3 again, of the court's
# first ruling: "a final rule as required by Section 3 of the Executive Order". The Final
# Rule's own preamble was not needed and was not read.
- id: eo-14399-usps-rule-enjoined-ddc
  claim: "the Postal Service is preliminarily enjoined from implementing and enforcing its Final Rule of Aug 21 (Ballot Mail for Federal Elections, 91 Fed. Reg. 54,966), in full and with no end date (D.D.C. order of Sep 13 in the three consolidated suits, 1:26-cv-01114 ECF 193)"
  kind: authored
  grade: {source: A, info: 1}
  source: "United States District Court for the District of Columbia, order of Sep 13, 2026 granting preliminary injunctions, DSCC v. Trump, No. 1:26-cv-01114 (CJN), ECF 193, with League of United Latin American Citizens v. Executive Office of the President, No. 1:26-cv-01132, and NAACP v. Trump, No. 1:26-cv-01151; its memorandum opinion is ECF 192, whose pp. 2-3 carry the rule's issuance at EO 14399's direction"
  asserted_on: 2026-09-13
  recheck_after: 2026-10-15
  falsified_by: "an order staying, vacating or modifying the Sep 13 injunction (1:26-cv-01114 ECF 193), by the D.D.C. court, the D.C. Circuit or the Supreme Court, or a D.C. Circuit ruling on an appeal from it; the instrument is the D.D.C. docket 1:26-cv-01114, read directly"
  status: active
  record_instruments: [73131864]
  renders_as: "The Postal Service is preliminarily enjoined from implementing and enforcing the ballot-mail rule it issued on Aug 21 at EO 14399's direction, in full and with no end date, by a D.D.C. order of Sep 13"

# 14 DAYS, NOT THE B2 DEFAULT OF 90, FROM 2026-09-13 TO 09-26, set while 26A305 was
# believed pending, because a pending emergency application can change the answer on
# any day. It was in fact pending only from Sep 6 until its denial on Sep 14; see READ
# AGAIN below. The source was then the Brennan Center tracker, whose authors are
# plaintiffs' counsel, and every order it describes is linked as a court PDF. This
# entry and eo-14248-enjoined below replace `eo-blocked-per-reporting` (C3, retired
# 2026-09-13): the date that line carried, Aug 16, matches no docket event, and the
# Aug 11 injunction it described was vacated Aug 26.
#
# THE FALSIFIER'S INSTRUMENT IS THE SUPREME COURT DOCKET, 26A305, read directly:
# https://www.supremecourt.gov/search.aspx?filename=/docket/docketfiles/html/public/26a305.html
# The tracker is secondary; it lags the docket (last updated Sep 11 when read on
# Sep 14). 26A305 replaced the withdrawn 26A297 on Sep 6. As of 2026-09-14 its only
# order is Justice Jackson's Sep 6 scheduling order (responses due Sep 9), and the
# applicants submitted a supplemental brief on Sep 14.
#
# READ AGAIN 2026-09-26: THE APPLICATION WAS DENIED ON SEP 14, the same day as the
# reading above, in the two entries after the supplemental brief that it did not see
# ("referred to the Court", then the order). The Court's words: "Application
# (26A305) for stay presented to Justice Jackson and by her referred to the Court is
# denied. The Government is unlikely to succeed on the merits of its challenge to
# the District Court's preliminary injunction. And the equitable factors applicable
# for obtaining emergency relief from this Court do not favor a stay." Justice
# Kavanaugh concurring; Justice Alito, joined by Justice Thomas, dissenting. The
# order: https://www.supremecourt.gov/opinions/25pdf/26a305_4g15.pdf
# So the rendered clause "a Supreme Court stay application has been pending since
# Sep 6" was false on the page from Sep 14 until the commit that rewrote this entry,
# while the core claim held throughout. For the Supreme Court application the
# falsifier named only a GRANT (its other event was a First Circuit merits ruling); a
# clause saying something is pending is falsified by any disposition at all.
# "Through the Nov. 3 election" is plaintiffs' counsel's phrase (the ACLU and
# Brennan Center releases of Sep 14), not the Court's, and the order names no date.
# "For the 2026 elections" rests on Justice Kavanaugh's concurrence and on the First
# Circuit's Sep 10 order, fn. 4: the injunction does not stop the Postal Service
# "continuing with the Final Rule's implementation for elections after November 2026".
#
# THE FIRST CIRCUIT has four appeals from the Sep 4 injunction, 26-2029 to 26-2032,
# consolidated Sep 14. Read on 26-2029's RECAP copy (CourtListener docket 74755121,
# last updated Sep 22): no merits ruling, no briefing schedule, no argument date.
# RECAP lags PACER, so an entry after Sep 22 would not show there.
#
# THE RECHECK, 2026-10-15, is set by the 09-26 brief rather than by a grade default,
# and Corey may move it. With no emergency application pending, what can change the
# answer is an order vacating, staying or modifying the Sep 4 injunction: from the
# D. Mass. court itself (1:26-cv-11549, 1:26-cv-13917), which vacated its own Aug 11
# injunction on Aug 26; from the First Circuit on the consolidated appeals, a merits
# ruling among them; or from the Supreme Court on a new application. A new
# application takes a NEW docket number, as 26A305 did after 26A297, so 26A305's own
# page would not show one: the recheck also searches the Court's docket for both
# captions this litigation has used there, United States Postal Service v.
# California and Trump v. California (the earlier stay, No. 26A124; see below).
#
# READ AGAIN 2026-09-27, IN THE COURTS' OWN WORDS, AND THE RENDERED CLAUSE WAS
# IMPRECISE. It read "section 3 of EO 14399, the USPS mail-ballot rule, is enjoined for
# the 2026 elections by a D. Mass. preliminary injunction of Sep 4", making the order's
# section and the Postal Service's rule one thing, by apposition. The orders keep them
# apart, and the Supreme Court's Aug 24 stay reaches section 3 itself:
#   - The Sep 4 order (1:26-cv-11549 ECF 285, with 1:26-cv-13917) "stays and
#     preliminarily enjoins the implementation or enforcement of the following sections
#     of the Final Rule as to elections occurring before or on November 3, 2026", seven
#     DMM 705.24 provisions, most "to the extent" they are mandatory. EO 14399 does not
#     appear in its decree. Its own summary: "prohibiting the United States Postal Service
#     ('USPS') from implementing mandatory sections of its final rule".
#   - The injunction against the order's sections is 1:26-cv-11581's: the June 25
#     memorandum and order (ECF 191, p. 34), "ENJOINED from implementing or giving
#     effect to Sections 2 and 3 of the EO with respect to the November 3, 2026 or any
#     earlier federal election in the Plaintiff States"; entered as final judgment Jul 7
#     (ECF 207), whose paragraphs 2.A-2.D restate that relief section by section.
#   - The Supreme Court stayed that injunction on Aug 24 in No. 26A124, Trump v.
#     California (lower court: First Circuit No. 26-1774): "The injunction entered by the
#     United States District Court for the District of Massachusetts in case No.
#     1:26-cv-11581 is stayed pending the disposition of the appeal in the United States
#     Court of Appeals for the First Circuit and disposition of a petition for a writ of
#     certiorari". Its per curiam keeps the section and the rule apart in terms: "Section
#     3 orders the Postal Service to initiate the process of proposing a rule that might
#     bind the States in the future. It is not a proposed rule, let alone a final rule."
#     The intervening States' application, No. 26A139, Alabama v. California (First
#     Circuit Nos. 26-1774 and 26-1779), was denied as moot the same day.
# So the claim now names the rule, and a second gate, eo-14399-s2-3-stayed, carries the
# stay of the injunction against the order's sections 2 and 3. "For the 2026
# elections" became the decree's "elections through Nov 3, 2026". Read by one reader
# per order, an adversarial refuter per reading and three independent judges (all
# three: imprecise), then against the files by hand.
#
# "MANDATORY" IS THE COURT'S OWN WORD for what it enjoined (Corey's condition, 2026-09-27:
# the phrase stays only if the Sep 4 order or the Final Rule calls the listed sections
# mandatory). ECF 285 p. 2: "the court GRANTS a preliminary injunction prohibiting the
# United States Postal Service ('USPS') from implementing mandatory sections of its final
# rule". p. 46: "enjoining the Final Rule's mandatory provisions". The decree, p. 48,
# qualifies four of its seven items "to the extent that the section makes ...
# mandatory"; the other three (DMM 705.24.5.1, the first two sentences of 705.24.5.2,
# 705.24.5.3(a)-(c)) carry no qualifier and fall inside what pp. 2 and 46 call mandatory.
#
# RENAMED 2026-09-27 from eo-14399-s3-enjoined, which named the order's section; the
# entry names the Postal Service's rule. The old id stays as an alias, and the records
# in docs/status.md keep it as written.
#
# ONE ORDER PER GATE (Corey, 2026-09-28). This entry carries the D. Mass. order of Sep 4
# alone, and its falsifier that order and its appeals only. The D.D.C. order of Sep 13 is
# eo-14399-usps-rule-enjoined-ddc above; neither order falsifies or supports the other's
# entry. The page renders the two as one sentence of two clauses, D.D.C.'s first. This
# entry's clause has its own subject, but its "the rule" takes its antecedent from the
# D.D.C. clause, so retiring either span means rewriting the other's `renders_as`. It
# keeps the courts' word: both "denied" the stay applications.
#
# `record_instruments` IS FILLED BY THE SEED COMMIT (2026-09-27): the held dockets among
# those this claim's falsified_by names -- 26-2029 (74755121), 1:26-cv-11549 (73133197),
# 1:26-cv-13917 (74701505). Check 4 counts each as pending until it binds, and no later
# than `record_instruments_due`, the day after the second walking run.
- id: eo-14399-usps-rule-enjoined
  aliases: [eo-14399-s3-enjoined]
  claim: "the Postal Service's final rule implementing EO 14399 section 3 is enjoined in its mandatory provisions for elections through Nov 3, 2026 (D. Mass. preliminary injunction, Sep 4), with First Circuit stays denied Sep 10 and a Supreme Court stay denied Sep 14"
  kind: authored
  grade: {source: A, info: 1}
  source: "Supreme Court of the United States, order of Sep 14, 2026 denying the application for stay, United States Postal Service v. California, No. 26A305, https://www.supremecourt.gov/opinions/25pdf/26a305_4g15.pdf; the injunction's terms per the D. Mass. memorandum and order of Sep 4, 2026 (1:26-cv-11549 ECF 285, with 1:26-cv-13917), Part V"
  asserted_on: 2026-09-14
  recheck_after: 2026-10-15
  falsified_by: "an order vacating, staying or modifying the Sep 4 injunction: by the D. Mass. court, by the First Circuit (Nos. 26-2029 to 26-2032, consolidated; a merits ruling vacating it among them), or a further Supreme Court order on it; the instruments are Supreme Court docket 26A305 and First Circuit docket 26-2029, read directly, with the D. Mass. docket and the tracker secondary"
  status: active
  record_instruments: [74755121, 73133197, 74701505]
  record_instruments_due: 2026-09-28
  renders_as: "A D. Mass. preliminary injunction of Sep 4 enjoins the mandatory provisions of the Postal Service's ballot-mail rule for elections through Nov 3, 2026; the First Circuit denied stays of it on Sep 10, and the Supreme Court denied one on Sep 14"

