# --- derived: no literal values below this line ----------------------------------
#
# `produced_by` names the function that computes the figure. Four of these
# functions do not exist yet -- they land in D3, in web/lib/stands.ts -- and the
# names are fixed here first so the component cannot invent a different one.
#
# TWO OF THESE ARE TRAPS, measured at D0 and written down where the implementer
# will see them:
#
#   district-circuit-split and open-split MUST classify through canonicalCourt.
#   The UW tracker types 'Eighth District' for the Eighth Circuit. Read raw, the
#   pair inverts to 30/22 and 10/21 and both readings look plausible.
#
#   vehicle-quiet-since MUST read bills.latest_action_at, NOT the bill's timeline.
#   S. 1383's timeline carries news items far newer than its last floor action, so
#   a timeline max silently reports a reporting date as a legislative one.

- id: suits-jurisdictions
  kind: derived
  produced_by: "web/lib/campaign.ts#summarize"
  renders_as: "DOJ has sued {sued} of {total} jurisdictions over voter-roll data"

# THE THREE DOCKET GATES CARRY THEIR SCOPE IN THE SENTENCE, not only in the code.
# They count `dojFilings(rows)` -- the 49 dockets whose plaintiff is the United
# States -- and NOT every row in `cases`. Three rows are suits by civil-society
# plaintiffs against federal agencies, one of them against DOJ itself, and an
# earlier reading folded those into a figure introduced by "DOJ has sued". A scope
# that lives only in a filter is a scope no reader of the page can check, so the
# words "DOJ filed" are part of what these gates render.

- id: dockets-total
  kind: derived
  produced_by: "web/lib/stands.ts#docketTotals"
  renders_as: "{total} dockets DOJ filed"

- id: district-circuit-split
  kind: derived
  produced_by: "web/lib/stands.ts#docketTotals"
  renders_as: "{district} district suits and {circuit} appeals, all of them DOJ filings"

- id: open-split
  kind: derived
  produced_by: "web/lib/stands.ts#openSplit"
  renders_as: "{open} of DOJ's dockets remain open -- {district} district, {circuit} on appeal"

# Named rather than dropped: dockets neither filed by the United States nor marked as
# EO challenges (relatedSuits takes both exclusions; see THE THREE SETS in stands.ts).
# It was the complement of DOJ's filings until the class below existed. These suits
# stay in the record and leave the DOJ count; a reader who tries to reconcile the map
# against the sentence should find the difference stated, in this clause and the
# class's below, instead of having to discover it.
- id: related-suits
  kind: derived
  produced_by: "web/lib/stands.ts#relatedSuits"
  renders_as: "{n} related suits by civil-society plaintiffs against federal agencies, none of them DOJ filings"

# THE THIRD SET: suits whose operative complaint seeks relief against an election
# executive order, or against agency action the complaint pleads was taken under one
# (Corey, 2026-09-26), marked `category: executive-order` on the seed. Counted in
# neither figure above, and the sentence says so in its own words.
#
# LAWSUITS, NOT DOCKETS. The count is the class's trial-court dockets. One held lead
# appeal stands for four consolidated ones, so an appeals figure would state a number
# the record does not hold (Corey, 2026-09-26).
#
# THE ORDER IS NAMED IN WORDS, "the mail-ballot executive order", because a derived
# entry may hold no digit outside a placeholder. Every docket seeded into the class
# seeks relief against EO 14399 or against agency action pleaded as taken under it
# (the USPS Rule); tests/test_eo_class_seeds.py keeps that true, and forces this
# sentence and its tab-2 twin, eo-challenges-held, to widen the day a 14248 docket is
# seeded.
#
# `names_order` is the order the sentence's words mean, carried beside them because the
# words may hold no digit. Both sentences that count eoLawsuits carry it, the test holds
# them equal, and it holds every seed and held row marked `executive-order` to it
# (Corey's ruling (a), 2026-09-26).
- id: eo-challenges
  kind: derived
  names_order: EO 14399
  produced_by: "web/lib/stands.ts#eoLawsuits"
  renders_as: "The record holds {n} challenges to the mail-ballot executive order, counted apart from DOJ's filings and the related suits"

# The same figure on tab 2's "Challenged in court" step. Its own entry, because one
# id with two texts is two claims that nothing compares.
- id: eo-challenges-held
  kind: derived
  names_order: EO 14399
  produced_by: "web/lib/stands.ts#eoLawsuits"
  renders_as: "{n} challenges to the mail-ballot order held in the record"

