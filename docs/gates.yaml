# docs/gates.yaml -- the claim register for the "Where this stands" section.
#
# WHY THIS FILE EXISTS. The section states things about the world. Some of them
# are read out of the record every render and cannot go stale without the record
# going stale first; some of them are editorial claims sourced to reporting, and
# those rot silently. This file is where the second kind carries its source and
# its expiry, and where the first kind is forbidden from carrying a value at all.
#
# TWO SHAPES, and the difference is the whole point (recon section 6).
#
#   authored -- an editorial claim. Carries grade, source, the date the SOURCE
#               said it, an expiry, and what would falsify it.
#   derived  -- a figure read from the record. Carries `produced_by` and
#               `renders_as` and NO NUMBER. A derived entry holding a literal is
#               the rot this file exists to end: 25, 12 and 46 all rotted in this
#               repo while looking maintained, because they were written down.
#
# ENFORCEMENT is `web/scripts/assert-gates.mjs`, three checks, two entry points:
#
#   1. every `data-gate` id in the rendered section has an entry here
#   2. every entry here with `renders_as` has its id on a `data-gate` in the rendered
#      section -- a join on gate ID. The `renders_as` text is not compared.
#   3. every authored entry's `recheck_after` is not in the past
#
# `renders_as` documents the text the gated element renders, and nothing checks
# it yet.
#
# 1 and 2 join against the DOM and are hand-run beside assert-encodings and
# assert-layout. 3 needs no browser and runs in ci.yml. See that script's header.
#
# `status: stale` IS AN ACKNOWLEDGEMENT, NOT A SUPPRESSION. It stops check 3
# failing the run; it does NOT stop the chip rendering grey with its date. The
# grey is the reader's signal and it is never silenced. What `stale` says is
# "a human has seen that this is past due and has not yet rechecked it".
#
# AND DO NOT BACKDATE A RECHECK TO DODGE THE GREY. `doj-demands-all-51` below
# ships grey on its first render, carrying an `asserted_on` from ~Sep 2025,
# because that is when the reporting behind it was published. Moving the date
# would make the file lie in exactly the direction it was built to prevent.
#
# recheck_after defaults by grade, per recon section 7.5, as starting numbers to
# be adjusted rather than a law: C3 30 days, B2 90 days, statutes 365 days.

- id: doj-scotus-possibility
  claim: "the Attorney General called a Supreme Court filing a possibility"
  kind: authored
  grade: {source: B, info: 2}
  source: "Democracy Docket"
  asserted_on: 2026-08-16
  recheck_after: 2026-11-14
  falsified_by: "a docket entry showing a cert petition filed"
  status: active
  renders_as: "The Attorney General called a Supreme Court filing a possibility on Aug 16."

- id: cert-window-nov-12
  claim: "a cert petition runs roughly 90 days from the Sixth Circuit's rehearing denial"
  kind: authored
  grade: {source: B, info: 2}
  source: "UW DOJ-suit tracker prose, data/doj_cases.json (Michigan row, ca6 26-1225)"
  # The tracker's own words: "On 8/14/26, the Sixth Circuit denied DOJ's request to
  # rehear the appellate panel's decision affirming dismissal of the case."
  asserted_on: 2026-08-14
  # Two days AFTER the ~Nov 12 window the claim itself names, so the recheck falls
  # once the window has closed rather than while it is still open. The section
  # renders "closes ~Nov 12"; this date is when a human looks again.
  recheck_after: 2026-11-14
  falsified_by: "a cert petition docketed"
  status: active
  # The gated element is the note's "the clock", which is what the approved mock
  # renders. This line read "Cert window open -- closes ~Nov 12" from 367d714
  # until 2026-09-13, which is the Path STEP's text. That step carries no
  # data-gate, so the two never matched, and check 2 compares ids only, so
  # nothing noticed.
  renders_as: "the clock"

# 14 DAYS, NOT THE B2 DEFAULT OF 90, because a pending emergency application can
# change the answer on any day. The source is plaintiffs' counsel, and every order
# it describes is linked as a court PDF. This entry and eo-14248-enjoined below
# replace `eo-blocked-per-reporting` (C3, retired 2026-09-13): the date that line
# carried, Aug 16, matches no docket event, and the Aug 11 injunction it described
# was vacated Aug 26.
#
# THE FALSIFIER'S INSTRUMENT IS THE SUPREME COURT DOCKET, 26A305, read directly:
# https://www.supremecourt.gov/search.aspx?filename=/docket/docketfiles/html/public/26a305.html
# The tracker is secondary; it lags the docket (last updated Sep 11 when read on
# Sep 14). 26A305 replaced the withdrawn 26A297 on Sep 6. As of 2026-09-14 its only
# order is Justice Jackson's Sep 6 scheduling order (responses due Sep 9), and the
# applicants submitted a supplemental brief on Sep 14.
- id: eo-14399-s3-enjoined
  claim: "the USPS mail-ballot rule under EO 14399 section 3 is enjoined for the 2026 elections (D. Mass. preliminary injunction, Sep 4), with a Supreme Court stay application pending since Sep 6 and First Circuit stays denied Sep 10"
  kind: authored
  grade: {source: B, info: 2}
  source: "Brennan Center case tracker, League of Women Voters of Massachusetts v. Trump, https://www.brennancenter.org/our-work/court-cases/league-women-voters-massachusetts-v-trump-march-2026-mail-voting-executive"
  asserted_on: 2026-09-11
  recheck_after: 2026-09-25
  falsified_by: "a Supreme Court order granting the stay, or a First Circuit merits ruling; the instrument for the first is Supreme Court docket 26A305 (the stay application), read directly, with the tracker secondary"
  status: active
  renders_as: "section 3 of EO 14399, the USPS mail-ballot rule, is enjoined for the 2026 elections by a D. Mass. preliminary injunction of Sep 4; the First Circuit denied stays on Sep 10, and a Supreme Court stay application has been pending since Sep 6"

# asserted_on is the tracker's update date, per this file's own rule (the date
# the SOURCE said it). The June reporting is older and serves as corroboration,
# not as the assertion date. 90 days is the B2 default, kept because the falsifier
# is an appellate order, which the tracker records.
- id: eo-14248-enjoined
  claim: "EO 14248's registration provisions are enjoined by three courts, permanently in D. Mass. since Jun 24, 2026"
  kind: authored
  grade: {source: B, info: 2}
  source: "Brennan Center case tracker, Sep 11, 2026 update (three courts blocked implementation of the first EO); corroborated by PBS/AP and The Hill reporting of Jun 24, 2026 on Casper's ruling and Newsweek on Kollar-Kotelly's D.D.C. ruling"
  asserted_on: 2026-09-11
  recheck_after: 2026-12-10
  falsified_by: "an appellate order vacating or staying either injunction"
  status: active
  renders_as: "the registration provisions of EO 14248 are enjoined by three courts, permanently in D. Mass. since Jun 24, 2026"

- id: doj-demands-all-51
  claim: "the written voter-roll demands went to all 50 states and DC"
  kind: authored
  grade: {source: B, info: 2}
  source: "Democracy Docket"
  # SHIPS GREY ON DAY ONE, deliberately, and this is the decision embedded in the
  # unit D handoff rather than an oversight. The reporting behind it is from about
  # September 2025; a B2 90-day recheck dated from the source therefore expired in
  # 2025. The honest options were "re-verify now and carry a fresh date" or "ship
  # grey with the real one"; the second was chosen. The day is approximate because
  # the source is a month, not a date -- see `asserted_precision`.
  asserted_on: 2025-09-01
  asserted_precision: month
  recheck_after: 2025-11-30
  falsified_by: "a jurisdiction shown never to have received a demand letter"
  # stale, not active: a human has seen the expiry and has not rechecked. Check 3
  # passes; the chip still renders grey with its 2025 date.
  status: stale
  renders_as: "The written demands went to all 50 states and DC."

# --- derived: no literal values below this line ----------------------------------
#
# `produced_by` names the function that computes the figure. Four of these
# functions do not exist yet -- they land in D3, in web/lib/stands.ts -- and the
# names are fixed here first so the component cannot invent a different one.
#
# TWO OF THESE ARE TRAPS, measured at D0 and written down where the implementer
# will see them:
#
#   district-circuit-split and open-split MUST classify through canonicalCourt.
#   The UW tracker types 'Eighth District' for the Eighth Circuit. Read raw, the
#   pair inverts to 30/22 and 10/21 and both readings look plausible.
#
#   vehicle-quiet-since MUST read bills.latest_action_at, NOT the bill's timeline.
#   S. 1383's timeline carries news items far newer than its last floor action, so
#   a timeline max silently reports a reporting date as a legislative one.

- id: suits-jurisdictions
  kind: derived
  produced_by: "web/lib/campaign.ts#summarize"
  renders_as: "DOJ has sued {sued} of {total} jurisdictions over voter-roll data"

# THE THREE DOCKET GATES CARRY THEIR SCOPE IN THE SENTENCE, not only in the code.
# They count `dojFilings(rows)` -- the 49 dockets whose plaintiff is the United
# States -- and NOT every row in `cases`. Three rows are suits by civil-society
# plaintiffs against federal agencies, one of them against DOJ itself, and an
# earlier reading folded those into a figure introduced by "DOJ has sued". A scope
# that lives only in a filter is a scope no reader of the page can check, so the
# words "DOJ filed" are part of what these gates render.

- id: dockets-total
  kind: derived
  produced_by: "web/lib/stands.ts#docketTotals"
  renders_as: "{total} dockets DOJ filed"

- id: district-circuit-split
  kind: derived
  produced_by: "web/lib/stands.ts#docketTotals"
  renders_as: "{district} district suits and {circuit} appeals, all of them DOJ filings"

- id: open-split
  kind: derived
  produced_by: "web/lib/stands.ts#openSplit"
  renders_as: "{open} of DOJ's dockets remain open -- {district} district, {circuit} on appeal"

# The complement, named rather than dropped. These suits stay in the record and
# leave the DOJ count; a reader who tries to reconcile the map against the sentence
# should find the difference stated instead of having to discover it.
- id: related-suits
  kind: derived
  produced_by: "web/lib/stands.ts#relatedSuits"
  renders_as: "{n} related suits by civil-society plaintiffs against federal agencies, none of them DOJ filings"

- id: wi-outcomes
  kind: derived
  produced_by: "web/lib/stands.ts#wisconsinOutcomes"
  renders_as: "In Wisconsin, {failed} of {tracked} tracked election bills failed and {vetoed} were vetoed."

- id: save-stall-months
  kind: derived
  produced_by: "web/lib/stands.ts#saveStallMonths"
  renders_as: "stalled {months} months"

- id: vehicle-quiet-since
  kind: derived
  produced_by: "web/lib/stands.ts#vehicleQuietSince"
  renders_as: "quiet since {date}"
