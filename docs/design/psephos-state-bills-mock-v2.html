for (const b of BILLS) { stTot[b.st]=(stTot[b.st]||0)+1; sTot[b.s]=(sTot[b.s]||0)+1; }

let fState=null, fStatus=null, sort="recent";

function drawMatrix() {
  let h = '<table><thead><tr><th></th>';
  for (const s of ORDER)
    h += `<th><span class="dot" style="background:${s==="1"?"var(--n700)":STATUS[s][1]}"></span>${STATUS[s][0]}</th>`;
  h += '<th class="tot">All</th></tr></thead><tbody>';
  for (const st of STATES) {
    h += `<tr><td class="rowlbl"><a href="#" data-st="${st}">${st}</a></td>`;
    for (const s of ORDER) {
      const n = cell[st+"|"+s]||0;
      h += n ? `<td class="c${s}"><a href="#" data-st="${st}" data-s="${s}">${n}</a></td>`
             : `<td class="c${s}"><span class="z">·</span></td>`;
    }
    h += `<td class="tot"><a href="#" data-st="${st}">${stTot[st]}</a></td></tr>`;
  }
  h += '<tr class="totals"><td><a href="#" data-all="1">All states</a></td>';
  for (const s of ORDER) h += `<td class="c${s}"><a href="#" data-s="${s}">${sTot[s]||0}</a></td>`;
  h += `<td class="tot"><a href="#" data-all="1">${BILLS.length}</a></td></tr></tbody></table>`;
  const m = document.getElementById("matrix"); m.innerHTML = h;
  m.querySelectorAll("a").forEach(a => a.onclick = e => {
    e.preventDefault();
    fState = a.dataset.st || null;
    fStatus = a.dataset.s || null;
    openList();
  });
}

function rowEl(b) {
  const li=document.createElement("li"); li.className="s"+b.s;
  li.innerHTML = `<a href="#"><div class="l1">
      <span class="no">${b.st} ${b.no}</span>
      <span class="ttl">${esc(b.t)}</span>
      <span class="stat s${b.s}">${(STATUS[b.s]||[b.s])[0]}</span>
    </div>
    <div class="l2"><span class="d">${fmt(b.d)}</span>${b.la?" — "+esc(b.la):""}</div></a>`;
  return li;
}

function drawMovement() {
  const ul = document.getElementById("movement");
  [...BILLS].sort((a,b)=>(b.d||"").localeCompare(a.d||"")).slice(0,10)
    .forEach(b=>ul.appendChild(rowEl(b)));
}

function openList() {
  const sec = document.getElementById("listSec");
  sec.hidden = false;
  let rows = BILLS.filter(b => (!fState||b.st===fState) && (!fStatus||b.s===fStatus));
  const parts = [];
  if (fState) parts.push(fState); else parts.push("All states");
  if (fStatus) parts.push(STATUS[fStatus][0].toLowerCase());
  document.getElementById("listTitle").textContent = parts.join(" · ");
  document.getElementById("listCount").textContent = rows.length + (rows.length===1?" bill":" bills");
  document.getElementById("sortRecent").className = sort==="recent"?"on":"";
  document.getElementById("sortState").className = sort==="state"?"on":"";
  const list = document.getElementById("list"); list.innerHTML="";
  if (sort==="recent" || fState) {
    rows=[...rows].sort((a,b)=>(b.d||"").localeCompare(a.d||"")||a.st.localeCompare(b.st)||a.no.localeCompare(b.no));
    const ul=document.createElement("ul"); rows.forEach(b=>ul.appendChild(rowEl(b))); list.appendChild(ul);
  } else {
    for (const st of STATES) {
      const grp=rows.filter(b=>b.st===st); if (!grp.length) continue;
      const g=document.createElement("div"); g.className="grp";
      g.innerHTML=`<h4>${st} <span class="n">${grp.length}</span></h4>`;
      const ul=document.createElement("ul");
      grp.sort((a,b)=>(b.d||"").localeCompare(a.d||"")).forEach(b=>ul.appendChild(rowEl(b)));
      g.appendChild(ul); list.appendChild(g);
    }
  }
  sec.scrollIntoView({behavior:"smooth", block:"start"});
}

document.getElementById("browseAll").onclick = e => { e.preventDefault(); fState=null; fStatus=null; openList(); };
document.getElementById("clear").onclick = () => { document.getElementById("listSec").hidden = true; window.scrollTo({top:0,behavior:"smooth"}); };
document.getElementById("sortRecent").onclick = () => { sort="recent"; openList(); };
document.getElementById("sortState").onclick = () => { sort="state"; openList(); };

drawMatrix(); drawMovement();
</script>
</body>
</html>
