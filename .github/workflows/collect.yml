name: collect
# The slot label, on every run. github.event.schedule is the cron line that fired
# (see ASSIGNMENT below); a dispatch has none.
run-name: "collect ${{ github.event.schedule || 'dispatch' }}"

on:
  schedule:
    # 17 past, not on the hour. The original reasoning was that GitHub queues
    # scheduled workflows for everyone at once, that the top of the hour is the
    # worst of it, and that 00:00Z is the peak of the peak. Nothing downstream
    # depends on the exact minute: the collectors are idempotent on content_hash
    # and the litigation poll works off a stored high-water mark, so the offset
    # changes when a cycle starts and nothing about what it collects.
    #
    # ANNOTATED 2026-09-07, both halves, because the sentence above asserted a
    # magnitude and a mechanism with no basis attached and one of them is wrong.
    #
    # MAGNITUDE -- measured, and far larger than "minutes to tens of minutes".
    # Against the slots this expression names (00:17 / 06:17 / 12:17 / 18:17Z),
    # the OBSERVED SPREAD is 2h05m to 5h04m across n=16 scheduled runs, 2026-09-04
    # to 09-08 -- every run since this expression took its current form at 58c6aca.
    # THE FAR EDGE IS CENSORED by the exclusion rule below: a run more than 6h past
    # its slot starts after the next slot fires, and when that next slot's own run
    # is missing the two cannot be told apart, so the spread is a lower bound on the
    # outer edge, not a measurement of it.
    # A seventeenth is deliberately excluded: 09-07 12:36:16Z is either the 12:17
    # slot 19m late or the 06:17 slot 6h19m late, and nothing in the run record
    # decides which.
    # A SECOND IS EXCLUDED, 2026-09-14, on the same rule: 12:50:51Z (run
    # 34845676455) is either the 06:17 slot 6h33m51s late or the 12:17 slot 33m51s
    # late. Three runs covered the four slots from 09-13 18:17 to 09-14 12:17, one
    # cron string serves every slot, and created_at equals run_started_at, so
    # nothing assigns it. That morning dom-checks (5h42m05s) and audit (5h27m37s)
    # both set new maxima for their lanes, which fits the 06:17 reading; recorded
    # as a hint, not used. Its data commit, dd3af8c, landed 6m19s after the start:
    # a new commit-lag floor, nine samples, 6m19s to 24m22s (docs/status.md).
    #
    # So a run is expected two to five HOURS after its slot, not minutes. That is
    # the durable part, and it matters to anyone timing a read against the next
    # run; getting it wrong once already armed a watcher against the wrong window.
    #
    # THIS IS THE SECOND CORRECTION TO THESE LINES, and saying so is the point.
    # The first fixed an arithmetic error -- the hours had been dropped from every
    # subtraction, turning 2h08m into 8 minutes. The second is this one: the
    # figures that replaced it, "the band is 2h08-4h42", were four runs of ONE DAY
    # written as an operating envelope, and the fuller table breaks them in both
    # directions -- 2h05m below the floor, 5h04m above the ceiling, twice. Same
    # claim, corrected twice, wrong in a different way each time.
    #
    # FOUR MORE SAMPLES, 2026-09-09, recorded as samples and not folded into the
    # spread above. Against the same slots, off run_started_at: 09-08 21:10:58Z =
    # 2h53m58s (18:17), 09-09 04:44:51Z = 4h27m51s (00:17), 09-09 11:25:40Z =
    # 5h08m40s (06:17), 09-09 16:40:07Z = 4h23m07s (12:17). The third is a NEW
    # MAXIMUM, past the 5h04m25s ceiling by 4m15s -- the second time in three days
    # a fresh reading has broken the previous outer bound, both times LONGER and
    # both on the 06:17 slot. The n=16 reading above is left exactly as it was.
    #
    # ONE MORE SAMPLE, 2026-09-13, recorded as a sample. The 09-13 06:17 slot's
    # run started 11:54:52Z (run_started_at, run 34755670262) = 5h37m52s -- a NEW
    # OUTER BOUND, past 5h08m40s by 29m12s, and again on the 06:17 slot. Its data
    # commit (61b8517, 12:19:14Z) would read 6h02m14s; that is the other clock.
    # Slot assigned by count: one scheduled run per slot from 09-09 18:17 through
    # 09-13 12:17, none missing, and 11:54:52Z precedes the 12:17 slot. (Counted
    # era -- see ASSIGNMENT below.)
    #
    # THE CLOCK IS PART OF THE SAMPLE, and this is the third correction to these
    # lines rather than a new kind of mistake. These four were first read off the
    # DATA COMMIT timestamps -- 3h04m, 4h43m, 5h22m, 4h28m -- a different
    # instrument from the one this record uses, which would have put three wrong
    # figures into a run_started_at table while supporting a conclusion that
    # happens to be true either way. Same family as the two corrections above: a
    # lag written down without the pair of events it subtracts. Record the clock
    # beside the number, and re-derive rather than transcribe.
    #
    # A SPREAD IS NOT A BOUND. What is written above is what was observed over five
    # days; a run outside it falsifies nothing and needs no edit here. Instrument:
    # pull the whole run_started_at table across days before writing any range, and
    # check the cron expression's own history first -- runs before 58c6aca were on
    # `0 */6` and belong to different slots entirely, so a table that reaches back
    # past it is measuring two schedules at once.
    #
    # MECHANISM -- the queuing half is contradicted by the run records, and is
    # stated here with its basis so the next reader can falsify it rather than
    # inherit it. On every completed run inspected, createdAt == startedAt, which
    # says the row is created at DISPATCH rather than created at the slot and
    # held in a queue. BASIS, stated inline because a mechanism claim needs one:
    # n=3 completed runs, created==started on all three, and no live queued row
    # has ever been observed for this workflow. That is thin, and it is written
    # thin on purpose -- it is this project's dated-absence rule applied to a
    # mechanism claim instead of an absence claim. The first queued row anyone
    # observes falsifies it, which is more than the original sentence offered.
    #
    # The offset itself is unchanged and still fine: whatever produces the lag,
    # nothing downstream depends on the minute, for the reasons above.
    #
    # ASSIGNMENT -- READ, NOT COUNTED, from the commit that split `17 */6` into
    # the four lines below (2026-09-14). Each line is its own trigger, so
    # github.event.schedule carries the string of the line that fired and every
    # run names its own slot: in its run-name (`gh run list --json displayTitle`),
    # which is written on every run including no-diff and red ones, and in its
    # data commit subject when it commits. The subject alone would go missing on
    # exactly the quiet runs.
    #
    # TWO ERAS, AND NOTHING RETROACTIVE IS FIXED. Through 2026-09-14 every slot
    # assignment in this record rests on COUNTING one scheduled run per slot, and
    # the spread's edges, 2h05m29s to 5h37m52s, were all measured in that counted
    # era. After this commit the label is read. The two excluded runs above stay
    # as history; the premise the counting carried is filed in docs/status.md.
    #
    # MISSED SLOTS ARE NOT INVISIBLE. 7 of 307 six-hour intervals (265 on `0 */6`,
    # 42 on `17 */6`, through the 09-14 12:17 slot) held no scheduled run at all,
    # a missed-slot rate near 2.3%, and none ever held two. Counted, an empty
    # interval makes its neighbours unassignable; labelled, it is one absent label
    # and the runs around it still name themselves.
    #
    # CONCURRENCY, set below at workflow level: `cancel-in-progress: false`
    # keeps a queued slot rather than killing a running one, but GitHub holds only
    # ONE pending run per group, so a third arrival cancels the pending second. A
    # cancelled run still carries its label, so it reads as a labelled
    # cancellation, which is recoverable; an empty interval is not, because it is
    # what makes its neighbours unassignable.
    - cron: "17 0 * * *"    # 00:17Z slot
    - cron: "17 6 * * *"    # 06:17Z slot
    - cron: "17 12 * * *"   # 12:17Z slot
    - cron: "17 18 * * *"   # 18:17Z slot
  workflow_dispatch: {}

permissions:
  contents: write
  # issues:write because the collect lane's delivery surface is a standing issue,
  # `collect red` (unit 99, R8): every red run comments on it (R10).
  issues: write

# Serialize runs, so a late slot and an on-time one queue instead of racing on
# `git push`. Pending-run cancellation is explained under CONCURRENCY above.
# Measured before adding it: two scheduled runs have never overlapped in 300
# (the three overlaps on record, 06-30 to 07-03, each paired a dispatch with a
# scheduled run). It does not serialize against a human push racing the bot's; the
# data commit step retries a raced push instead (see it, below).
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Bounds the retry ladders, not the runtime. db._retry_transport sleeps up to
    # ~10.5s per failing connection establishment and _Conn's reopen inherits it,
    # so a sustained Turso outage multiplies that by every failing statement and
    # every per-item recover() -- state.py alone iterates 484 bills, which at ~21s
    # each is ~2.8 hours. Without this the GitHub default of 360 minutes applies
    # and such a run collides with the next 6-hourly cron.
    #
    # 45 AND NOT 30, ORIGINALLY -- kept as history, because the arithmetic below is
    # no longer the rule. Measured wall clock was 5m42s-16m42s across 8 scheduled
    # runs (the four of 08-11 and the four of 08-12; the 08-10 dispatch at 14m38s is
    # a ninth point inside that range), longest run 31629075586, 08-12 18:43Z, and
    # the number was argued for as a 2x spike off that maximum. The conclusion held
    # and the reasoning did not; the rule that replaced it is directly below.
    #
    # THE RULE, RULED 2026-09-17: THE TIMEOUT IS A HANG DETECTOR, AND THE 2x
    # MULTIPLIER IS RETIRED. It is not a scaling of the worst normal run. It stays
    # above the observed maximum wall clock by a margin, and that is the whole of it.
    # A HEALTHY RUN REACHING 45 IS A FINDING ABOUT THAT RUN -- something hung, or the
    # work changed shape -- and is to be diagnosed, NOT answered by raising the
    # number. Nothing downstream derives from the ratio, so there is no ratio to keep.
    #
    # The figures, recorded once so a later reader does not re-derive them: 45 minutes
    # against an observed maximum wall clock of 32m27s across 47 scheduled runs since
    # 58c6aca, read 2026-09-16 and declared in docs/bands.yaml as `wall_clock`. 45 was
    # originally chosen above 2x a then-maximum of 16m42s across 8 runs.
    #
    # AND NO MULTIPLIER WOULD HAVE HELD, which is why this is a rule change and not a
    # preference. bands.yaml says in its own words that these bands are NOT
    # converging; `wall_clock.far` is the one edge in that file that cannot even be
    # SIGNED, because sampling understates a maximum while the `updatedAt` lag
    # overstates every sample and the run record cannot separate them. A rule of the
    # form `2x the far edge` would therefore have moved the timeout every time an
    # unsignable number walked. The 30-minute bound this comment once considered and
    # rejected would have KILLED run 34122774777 at 32m27s, a healthy success -- so
    # the choice of 45 over 30 was right, and it was right for the hang-detector
    # reason rather than for the arithmetic offered at the time.
    #
    # The counts differ on purpose. This comment says 8 scheduled runs for the
    # original choice; docs/status.md says 9 by including the 08-10 dispatch. Both are
    # right for what they count, and the original bound keeps 8, that being the
    # population it was set against.
    #
    # Re-derive wall clock from the same instrument before touching this number --
    #   gh run list --workflow collect.yml --json databaseId,createdAt,startedAt,updatedAt
    # across more than one day -- and re-check it before lengthening any ladder. The
    # 6-12 minute band this comment carried until 08-13 was five runs from one sweep
    # written as a range without its sample size, and it was falsified at both ends
    # within a day.
    timeout-minutes: 45
    # NO LOCAL FALLBACK IN CI (R1, Corey, 2026-09-28). With this set, db refuses an empty
    # or local TURSO_DATABASE_URL at the first database call any step makes, so the job
    # fails before any channel runs, commits nothing and spends nothing. Without it an
    # empty URL secret ran all six channels GREEN against a throwaway SQLite file and
    # committed snapshots built from it. See db.REQUIRE_REMOTE_ENV.
    env:
      PSEPHOS_REQUIRE_REMOTE: "1"
    steps:
      # THE JOB'S OWN START, stamped before anything else runs. There is no context
      # variable for it: `github.run_started_at` exists only on `workflow_run` events,
      # and the REST API's `run_started_at` is not readable from inside the run without
      # a call. This is the runner's wall clock, which is a legitimate read -- it dates
      # a RUN, never a record row, and the single-writer clock rule is about the latter.
      # It is the job start rather than the run start; for a single-job workflow the two
      # differ by the queue, and nothing downstream reads this as a fire lag.
      - name: Stamp the run's start
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # The steps before the Verdict carry ids, so the Verdict can name the one that failed
      # (tools/collect_verdict.STEPS, pinned to these by tests/test_collect_failed_step.py).
      - id: checkout
        uses: actions/checkout@v4

      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No separate schema-bootstrap step: every collector's main() calls
      # db.init_db() before its first query, and schema.sql is CREATE ... IF NOT
      # EXISTS, so the first collector below self-bootstraps a fresh database.
      # A dedicated step only re-applied that seconds earlier, and its unguarded
      # connection cost three complete cycles to a Turso transport 502 on 08-06/07.
      - name: Run collectors
        id: collectors
        env:
          # Python block-buffers stdout when it is a pipe, which the runner's log
          # capture is. Every per-request line therefore carried the process-exit
          # timestamp, and throttle spacing had to be reconstructed as an interval
          # instead of read off the log. Collectors step only -- the other steps
          # emit at coarse enough granularity that the timestamps are already real.
          PYTHONUNBUFFERED: "1"
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          # The state collector runs on ONE slot a day (handoff 98b §4a) and reads the
          # firing cron line from here; every other slot prints `state: not this slot`
          # and exits 0. Same expression as the commit and heartbeat steps below. The
          # other five collectors ignore it.
          SLOT: ${{ github.event.schedule || 'dispatch' }}
        # THE FAILED STEP NAMES ITSELF (Corey, 2026-10-05). The 2026-10-04 06:17Z slot's run
        # died in litigation on a Turso drop and the Verdict could say only "an earlier step
        # ended failure". So the collectors run as one group whose output is also kept at
        # $RUNNER_TEMP/collectors.log, and an ERR trap keeps the command that failed at
        # $RUNNER_TEMP/collectors.failed; the Verdict names this step, that command and the
        # log's last line. `bash -e` still ends the group at the first failure, and pipefail
        # carries its status out through tee. tests/test_collect_failed_step.py plants a
        # collector exception in this exact script.
        run: |
          set -o pipefail
          {
            failed() { printf '%s\n' "$BASH_COMMAND" > "$RUNNER_TEMP/collectors.failed"; }
            trap failed ERR
            python -m collectors.legislation
            python -m collectors.tracker_uw      # discover the full DOJ-suit list -> data/doj_cases.json
            python -m collectors.litigation      # then resolve + poll (reads that artifact)
            python -m collectors.executive
            python -m collectors.news
            python -m collectors.state
          } 2>&1 | tee "$RUNNER_TEMP/collectors.log"

      - name: Export JSON snapshots
        id: export
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        # Its output is kept at $RUNNER_TEMP/export.log too, for the Verdict's line.
        run: |
          set -o pipefail
          python -m export.snapshots 2>&1 | tee "$RUNNER_TEMP/export.log"   # reads Turso; writes data/*.json for the view and for diffs

      # THE DATA COMMIT, AND A RACED PUSH (Corey, 2026-09-30). The concurrency group
      # serializes collect runs, not a human push, and on 2026-09-30 one landed while the
      # 00:17Z slot's run (36674320722) was collecting: its bare `git push` was rejected
      # (fetch first), the step failed, and the verdict went red naming only "an earlier
      # step ended failure" -- never the lost commit. So a rejected push is fetched and
      # retried, three pushes in all, on the branch the run checked out:
      #   * origin has not moved: the rejection was not a race, and nothing is repaired;
      #   * the commits it raced touch nothing under data/ (a docs or code commit): the data
      #     commit is rebased onto them, and needs no export re-run;
      #   * they touch data/: the data commit is dropped and the export re-run on top of
      #     them, so the snapshot is written against the files as they stand. The export
      #     does not write data/doj_cases.json (collectors.tracker_uw does, a step earlier),
      #     so this run's copy is carried across and wins over the raced one.
      # No repair follows the third push, since nothing would push it.
      # THE MARKER IS THE DEFAULT. $RUNNER_TEMP/data-commit-not-pushed is written before
      # anything else and cleared only by a landed push or by nothing left to push, so a
      # step that dies under -e or is cancelled mid-repair still leaves it. The Verdict
      # turns the run red on it with the evidence line "data commit not pushed", git's own
      # rejection line included; the step exits 0 when it gives up, so the Verdict is what
      # names it. tests/test_data_commit.py plants the concurrent push. DATA_EXPORT exists
      # for that test; the run uses the default.
      - name: Commit data changes
        id: commit
        env:
          # The slot label, via env rather than inline in the script.
          SLOT: ${{ github.event.schedule || 'dispatch' }}
          # For the export re-run, when a raced commit touched data/.
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          git config user.name "psephos-bot"
          git config user.email "actions@users.noreply.github.com"
          stage() {
            # Stage only the text snapshots explicitly. NOT `git add data/`: data/psephos.db
            # is not in .gitignore, so a glob add could start committing the binary.
            # Every new snapshot must be added here by name or it is written each run
            # and never committed -- silent, since the export prints it either way.
            # THIS WARNING WAS CORRECT AND UNHEEDED: data/generated_at.json was added
            # to the export and not to this line, so it was rewritten every cron and
            # committed by none of them, leaving the tracked copy frozen at a
            # hand-seeded 2026-09-07 -- which is the clock assert-gates.mjs compares
            # `recheck_after` against, and the date the page shows readers as its
            # as-of. A prose warning cannot fail. tests/test_snapshot_staging.py now
            # joins this line to the export's own *_PATH constants and does.
            git add data/bills.json data/cases.json data/executive.json data/state_bills.json data/news.json data/doj_cases.json data/generated_at.json
          }
          marker="$RUNNER_TEMP/data-commit-not-pushed"
          echo "data commit not pushed: the step ended before a push landed" > "$marker"
          # An array, not a bare expansion: shellcheck (actionlint) refuses unquoted words.
          if [ -n "${DATA_EXPORT:-}" ]; then
            read -r -a export_cmd <<< "$DATA_EXPORT"
          else
            export_cmd=(python -m export.snapshots)
          fi
          stage
          if git diff --cached --quiet; then
            rm -f "$marker"
            echo "No changes."
            exit 0
          fi
          # This run's tracker artifact, kept only when the run moved it, so a re-export over
          # a raced commit can put it back.
          scrape="$RUNNER_TEMP/doj_cases.run.json"
          rm -f "$scrape"
          if ! git diff --cached --quiet -- data/doj_cases.json; then
            cp data/doj_cases.json "$scrape"
          fi
          # The branch the bare push targets: main on the schedule, the branch dispatched on.
          branch="$(git symbolic-ref --short -q HEAD || echo main)"
          msg="data: scheduled collection $(date -u +%Y-%m-%dT%H:%MZ) (slot $SLOT)"
          git commit -m "$msg"
          err="$RUNNER_TEMP/data-commit-push.err"
          last=""
          said=""
          for attempt in 1 2 3; do
            if git push 2> "$err"; then
              cat "$err" >&2
              rm -f "$marker"
              echo "data commit pushed (attempt $attempt)"
              exit 0
            fi
            cat "$err" >&2
            said="$( { grep -m1 '^ ! ' "$err" || grep -m1 -E '^(fatal|error|remote):' "$err" || true; } | sed -e 's/^ *//' -e 's/  */ /g')"
            if [ "$attempt" = 3 ]; then
              break
            fi
            echo "data commit: push rejected (attempt $attempt); fetching what it raced"
            if ! git fetch origin "$branch"; then
              last="the fetch failed"
              continue
            fi
            if [ "$(git rev-parse "origin/$branch")" = "$(git rev-parse HEAD~1)" ]; then
              last="none, origin had not moved, so the rejection was not a race"
              continue
            fi
            if git diff --quiet HEAD~1 "origin/$branch" -- data/ && git rebase "origin/$branch"; then
              last="rebased onto a commit that touched nothing under data/"
              continue
            fi
            git rebase --abort 2>/dev/null || true
            echo "data commit: the raced commit touched data/; re-running the export on top of it"
            git reset --hard "origin/$branch"
            if ! "${export_cmd[@]}"; then
              last="the export re-run failed"
              break
            fi
            if [ -f "$scrape" ]; then
              cp "$scrape" data/doj_cases.json
            fi
            stage
            if git diff --cached --quiet; then
              rm -f "$marker"
              echo "No changes after the re-export."
              exit 0
            fi
            git commit -m "$msg"
            last="re-exported on top of a commit that touched data/"
          done
          echo "data commit not pushed: the push was rejected $attempt time(s); last repair: ${last:-none tried}; git said: ${said:-nothing}" | tee "$marker"
          exit 0

      # THE VERDICT (unit 99, Corey, 2026-09-28). The collectors keep their exit 0; they
      # write one `channel_runs` row per class they met, and this step reads them with the
      # three receipts and turns the run red when a channel failed loudly: a credential
      # failure, a missing secret, no OK replies, a run cut short, an expected channel with
      # no row at all, a stale receipt, a deferral past its rotation, or an earlier step
      # that failed. `if: always()` so a red earlier step still gets its verdict and its
      # comment; BEFORE the heartbeat, so the runs row's conclusion records a red verdict.
      - name: Verdict
        id: verdict
        if: always()
        env:
          SLOT: ${{ github.event.schedule || 'dispatch' }}
          JOB_STATUS: ${{ job.status }}
          # Each step's outcome by id, so a red job names the step that failed (Corey,
          # 2026-10-05).
          STEP_OUTCOMES: >-
            checkout=${{ steps.checkout.outcome }}
            python=${{ steps.python.outcome }}
            deps=${{ steps.deps.outcome }}
            collectors=${{ steps.collectors.outcome }}
            export=${{ steps.export.outcome }}
            commit=${{ steps.commit.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # Not for any call: the failed step's last line is raw collector output, so the
          # Verdict scrubs it of every credential the collectors carry, as the issue step does.
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: python -m tools.collect_verdict

      # THE STANDING ISSUE (unit 99, R8 and R10), BEFORE the heartbeat, which stays the
      # run's last step (tests/test_heartbeat.py): this step never changes the job's
      # status, so the heartbeat still records the red. Every red run comments on one issue,
      # `collect red`, reused by exact title, with each channel, class and evidence line
      # from the verdict. A person closes it against the first clean run. Uses no
      # database, so it reports even the run the empty-URL guard stopped before any
      # channel ran.
      #
      # KEYED ON THE VERDICT'S OUTCOME, NOT `failure()`. A cancelled run -- the 45-minute
      # timeout is the hang detector, and it cancels -- keeps the job status `cancelled`,
      # where `failure()` is false, so the verdict would go red on it and nothing would
      # comment. The verdict runs on every path (`always()`) and exits 1 on every red,
      # an earlier failed or cancelled step included, so its outcome is the whole test.
      # GH_REPO because `gh` otherwise finds the repo from the checkout, and a run whose
      # checkout failed is exactly one that has to comment.
      - name: Raise or update the standing issue
        if: ${{ always() && steps.verdict.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: collect red
          SLOT: ${{ github.event.schedule || 'dispatch' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The run's credentials, for the scrub below and nothing else.
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          body="$RUNNER_TEMP/collect-verdict.md"
          if [ ! -s "$body" ]; then
            {
              echo "cc @CSU-J3"
              echo
              echo "**collect red** -- run [${GITHUB_RUN_ID}](${RUN_URL}), slot \`${SLOT}\`"
              echo
              echo "The verdict wrote no body: it crashed before writing one (a failed"
              echo "install or setup leaves it nothing to run on). See the run's steps."
            } > "$body"
          fi
          # SCRUBBED BEFORE IT IS POSTED (unit 99, 2026-09-28). Actions masks secrets in the
          # run log, not in what a step sends to the Issues API. tools/scrub_issue_body.py
          # runs scrub.py -- the one scrub every lane uses -- over the body with this step's
          # credentials from its env: each value replaced, every URL's query string dropped.
          # By path, not `-m`, so it runs from any working directory on the runner's python3.
          # tests/test_issue_body_scrub.py fails a posting step that skips it.
          python3 "$GITHUB_WORKSPACE/tools/scrub_issue_body.py" "$body"
          # Exact-title match, not the search ranking: `gh issue list --search` is fuzzy.
          num=$(gh issue list --state open --limit 100 --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | first | .number // empty")
          if [ -n "$num" ]; then
            echo "commenting on the standing issue ${num}"
            gh issue comment "$num" --body-file "$body"
          else
            echo "opening the standing issue"
            gh issue create --title "$TITLE" --body-file "$body"
          fi

      # THE HEARTBEAT, AND `if: always()` IS THE WHOLE POINT OF THE STEP.
      #
      # A row here says THIS RUN HAPPENED. Its absence for a slot is the only evidence
      # the page has that a slot never fired, so the step must survive everything above
      # it: a collector raising, the export dying, the push being rejected. Without
      # `always()` a FAILED run would leave no row and read, from the page, exactly like
      # a run that never started -- which is the one distinction this table exists to
      # make. `conclusion` carries which of the two it was.
      #
      # WHY NOT INSIDE THE EXPORT, which does already run once per run: the export sits
      # behind the collectors with no `if: always()` of its own, so a heartbeat written
      # there inherits exactly the failure mode above. And why not inside a collector:
      # six separate processes run in one step and no one of them knows the run's total,
      # its conclusion, or that it finished. NO PROCESS SPANS THE RUN -- which is why
      # this is the first table the WORKFLOW writes rather than a collector.
      #
      # `items_written` is read off the record rather than reported by the collectors:
      # `items.fetched_at` is stamped at insert and never updated, so the run's items are
      # exactly those stamped at or after RUN_STARTED_AT. One count, one place to be
      # wrong, instead of six processes agreeing on a total through a file.
      - name: Write the run heartbeat
        if: always()
        env:
          SLOT: ${{ github.event.schedule || 'dispatch' }}
          JOB_STATUS: ${{ job.status }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m scripts.write_heartbeat
