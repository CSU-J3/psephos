name: collect

on:
  schedule:
    # 17 past, not on the hour. GitHub queues scheduled workflows for everyone at
    # once and the top of the hour is the worst of it -- a run can sit minutes to
    # tens of minutes behind its slot, and 00:00Z is the peak of the peak. Nothing
    # downstream depends on the exact minute: the collectors are idempotent on
    # content_hash and the litigation poll works off a stored high-water mark, so
    # the offset changes when a cycle starts and nothing about what it collects.
    - cron: "17 */6 * * *"   # every 6 hours (UTC), off the top of the hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # Bounds the retry ladders, not the runtime. db._retry_transport sleeps up to
    # ~10.5s per failing connection establishment and _Conn's reopen inherits it,
    # so a sustained Turso outage multiplies that by every failing statement and
    # every per-item recover() -- state.py alone iterates 484 bills, which at ~21s
    # each is ~2.8 hours. Without this the GitHub default of 360 minutes applies
    # and such a run collides with the next 6-hourly cron.
    #
    # 45 and not 30. Measured wall clock is 5m42s-16m42s across 8 scheduled runs
    # (the four of 08-11 and the four of 08-12; the 08-10 dispatch at 14m38s is a
    # ninth point inside that range), longest run 31629075586, 08-12 18:43Z. That
    # spread is 3x, so a 2x spike off the observed maximum is ~33 minutes and a
    # 30-minute bound would kill a healthy run. The 6-12 minute band this comment
    # carried until 08-13 was five runs from one sweep written as a range without
    # its sample size, and it was falsified at both ends within a day. Re-derive
    # from the same instrument before changing it --
    #   gh run list --workflow collect.yml --json databaseId,createdAt,startedAt,updatedAt
    # across more than one day -- and re-check it before lengthening any ladder.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No separate schema-bootstrap step: every collector's main() calls
      # db.init_db() before its first query, and schema.sql is CREATE ... IF NOT
      # EXISTS, so the first collector below self-bootstraps a fresh database.
      # A dedicated step only re-applied that seconds earlier, and its unguarded
      # connection cost three complete cycles to a Turso transport 502 on 08-06/07.
      - name: Run collectors
        env:
          # Python block-buffers stdout when it is a pipe, which the runner's log
          # capture is. Every per-request line therefore carried the process-exit
          # timestamp, and throttle spacing had to be reconstructed as an interval
          # instead of read off the log. Collectors step only -- the other steps
          # emit at coarse enough granularity that the timestamps are already real.
          PYTHONUNBUFFERED: "1"
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: |
          python -m collectors.legislation
          python -m collectors.tracker_uw      # discover the full DOJ-suit list -> data/doj_cases.json
          python -m collectors.litigation      # then resolve + poll (reads that artifact)
          python -m collectors.executive
          python -m collectors.news
          python -m collectors.state

      - name: Export JSON snapshots
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m export.snapshots       # reads Turso; writes data/*.json for the view and for diffs

      - name: Commit data changes
        run: |
          git config user.name "psephos-bot"
          git config user.email "actions@users.noreply.github.com"
          # Stage only the text snapshots explicitly. NOT `git add data/`: data/psephos.db
          # is not in .gitignore, so a glob add could start committing the binary.
          # Every new snapshot must be added here by name or it is written each run
          # and never committed -- silent, since the export prints it either way.
          git add data/bills.json data/cases.json data/executive.json data/state_bills.json data/news.json data/doj_cases.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: scheduled collection $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
