name: ci

# The first CI workflow in this repo. Until 2026-08-14 `collect.yml` was the only
# workflow, so NOTHING gated a push: 165 pytest tests existed and ran only when a human
# remembered to run them locally. Handoff 56 asked for vitest to "fail the workflow the
# way pytest does" -- pytest did not fail any workflow either, because there was none.
# Both suites gate here now.
#
# Deliberately not folded into collect.yml. That workflow is a scheduled data job with
# write permissions and live API keys; a test failure there would abort a collection
# cycle, and a collection failure would look like a test failure. This one takes no
# secrets and needs no write access, which is why `permissions` is read-only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # matches collect.yml; keep the two in step

      # requirements-dev.txt, not requirements.txt: the latter is what the cron
      # installs and carries no test runner. Installing the production list and then
      # running pytest is how this job failed its first run.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # tests/conftest.py blocks live HTTP at HTTPAdapter.send, and no suite reads
      # Turso, so this job needs no secrets. If a test ever fails here for want of a
      # credential, that test is reaching something it should be stubbing.
      - name: pytest
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # package_json_file is resolved from the REPO ROOT, not from the job's
      # working-directory -- `defaults.run` applies to `run` steps only, never to an
      # action's inputs. There is no root package.json, so the default made the action
      # fail with "No pnpm version is specified" on this job's first run. Pointing it
      # at web/package.json is what lets it read `packageManager` for the version.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Logic only -- lib/**/*.test.ts, no jsdom, no component rendering. See
      # web/vitest.config.ts for why the line is drawn there.
      - name: vitest
        run: pnpm test

      # Typecheck too: the read layer has no runtime test of its components, so tsc is
      # the only thing standing behind the pages themselves.
      - name: tsc
        run: npx tsc --noEmit

      # And a check on what tsc CANNOT say, which is the point of it sitting here.
      # `x as unknown as T` compiles by definition -- it is the construct for telling
      # the compiler to stop objecting -- so a green tsc is exactly as green with 19 of
      # them as with none. One of the 19 in lib/db.ts shipped 129 runtime warnings per
      # page load with tsc clean throughout. This counts them from the AST and fails on
      # any file over its pinned floor, every floor currently 0.
      #
      # It runs here rather than as a lint rule because there is no eslint in this
      # project, and as an AST walk rather than a grep because a grep matching this
      # construct also matches the comments explaining it: as this commit lands, a grep
      # over lib/components/app/scripts reads 6 matches against 0 actual casts, and
      # half of those matches are in the checker's own header.
      - name: assert-casts
        run: node scripts/assert-casts.mjs

      # The expiry half of the gate register, and only that half. Checks 1 and 2 of
      # assert-gates join against a rendered DOM and need playwright plus a running
      # server, which is what keeps assert-encodings and assert-layout out of this
      # workflow; check 3 needs a YAML file and a date string, so it runs here.
      #
      # It is the half worth automating. An authored claim expires SILENTLY -- the
      # page keeps rendering it, correctly formatted, sourced and graded, long after
      # nobody has checked whether it is still true -- and `recheck_after` is the
      # only property of such a claim a machine can fail on. The DOM join catches a
      # claim nobody registered; this catches a claim nobody revisited.
      #
      # NOTE THIS NOTIFIES AND BLOCKS NOTHING. Vercel deploys from git on its own,
      # so a red run here does not hold a deploy. That is deliberate: recon section
      # 7.7 declined a build gate because a stale claim blocking an unrelated deploy
      # creates pressure to widen the gate rather than recheck the claim.
      #
      # It reads data/generated_at.json, written by the export each cron, NEVER the
      # runner's clock -- so the comparison is against when the record last moved.
      - name: assert-gates (expiry)
        run: node scripts/assert-gates.mjs --expiry-only

  # Lints every workflow, including the expressions nothing else reads. A malformed
  # `${{ }}` in collect.yml's run-name renders EMPTY at run time rather than failing,
  # so the slot label would go blank on green runs; this is the first thing in the
  # repo that parses those expressions before a scheduled run does. It does NOT catch
  # a misspelt event property (`github.event.schedulee`): `github.event` is untyped
  # to actionlint, which is why tests/test_collect_schedule.py pins that by regex.
  #
  # Pinned binary, checksum-verified, no marketplace action. The sha256 is the
  # linux_amd64 line of the v1.7.12 release's own checksums file. shellcheck comes
  # from the runner image and is NOT pinned, so a new image can add findings with
  # no change here; the step prints its version so a red run says which one.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          if command -v shellcheck >/dev/null; then
            shellcheck --version | head -2
          else
            echo "shellcheck not on PATH: run: scripts go unchecked"
          fi

      - name: actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml
