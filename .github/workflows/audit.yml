name: audit

# The delivery half of unit C. Every alarm this runs was already correct and already
# available before this workflow existed -- coverage_audit section 1 read 6 for
# seventeen days, and tracker_uw's unmapped-court WARN (now section 5) fired four
# times a day into a stderr nothing reads. Nothing here improves detection. What it
# adds is a reader: a red run opens a GitHub issue that stays open until a person
# closes it.
#
# The issue, not the red run, is the delivery surface, and that distinction is the
# whole design. This repo's other scheduled workflow has gone red 10 times in 200
# runs; the most recent (2026-08-21, the "Commit data changes" step) left no fix
# commit and no mention in any doc, and the next run simply succeeded. A run status
# is a thing you have to go and look at. An open issue is a thing that is there when
# you next look at the repo at all.

on:
  schedule:
    # 05:17Z daily. The reasoning, and its limit, stated rather than implied: the
    # 00:17 collect cycle usually lands some HOURS after its slot, so this nominally
    # reads a database the night's collection has already written. HOW MANY hours is
    # not a figure this comment gets to state. It used to cite a band of 2h08-4h42
    # and a close "around 05:00" derived from it; both came from four runs of a
    # single day, and the fuller table breaks them in both directions (see
    # collect.yml, where the spread is restated with its n and its dates).
    #
    # But this workflow is queued by the same scheduler and carries the same lag, so
    # in practice it will often land inside the 06:17 cycle's window instead. That
    # precision is not available and is not claimed.
    #
    # AND THE QUANTITY THAT WOULD ACTUALLY DECIDE THIS SLOT IS UNMEASURED IN THIS
    # REPO. Everything above is about when a run STARTS. What 05:17 needs to know is
    # when the night's collection FINISHES, since the database is written across a
    # cycle rather than at its opening -- and nothing here records that. Not an
    # oversight in the table: run_started_at cannot answer it by construction, being
    # the near edge of the interval whose far edge is the question. The nearest
    # available proxy is the DATA COMMIT, which lands after the export AND ONLY ON
    # A DIFF -- a cycle that collects nothing writes no commit at all, so the proxy
    # goes missing on exactly the quiet runs, which are the runs where a stale read
    # would be hardest to notice. That is a SECOND and INDEPENDENT reason it is not
    # in the record, beside the first: a table whose rows come off two different
    # subtractions cannot be checked against itself. So the proxy exists, is not
    # used, and this slot rests on a quantity nobody has measured.
    # Said plainly because a reader who wants that number has to go and make it, and
    # should know that before mistaking one of the numbers above for it.
    #
    # Two samples of its own, recorded as samples and not as a band: 2026-09-08
    # started 09:46:31Z, 4h29m31s past the slot, and 2026-09-09 started 09:50:47Z,
    # 4h33m47s. Both land inside the 06:17 cycle's window exactly as the paragraph
    # above expects. Both are run_started_at readings, the same instrument
    # collect.yml's table uses -- said out loud because a commit-clock reading of
    # the same runs gives different figures and does not belong beside these.
    #
    # It is harmless because the audit is read-only and idempotent. The one real
    # consequence is that a mid-cycle read could in principle catch a transient
    # section 1 -- which is a reason to read the issue BODY, where the offending
    # rows are named, rather than reacting to the red status alone.
    - cron: "17 5 * * *"
  workflow_dispatch: {}

# Least privilege, twice over. contents:read because the audit writes nothing to the
# repo; issues:write because the delivery surface is an issue. Note this workflow
# never gets contents:write -- unlike collect.yml, it has no data commit to make.
permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # matches collect.yml and ci.yml; keep in step

      # requirements.txt, not -dev: this runs the tool, not the suite.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # TURSO_AUTH_TOKEN is the variable db.py reads; TURSO_READ_TOKEN is a
      # READ-ONLY Turso token held as a separate secret. The MAPPING is what enforces
      # least privilege, and it works: this workflow cannot write to the database even
      # if the tool one day tried to.
      #
      # WHAT WAS FALSE HERE WAS "no code change". This comment claimed least privilege
      # cost nothing but a variable name. The first scheduled run (2026-09-08) never
      # read a row: Turso counts `PRAGMA foreign_keys = ON` as a WRITE, db.py issued
      # it on every connect as its establishment probe, and the token refused it --
      # correctly, which is the part worth separating. The mapping did its job; the
      # code could not live with the job being done, and the failure looked like a
      # broken connection rather than a permission boundary holding.
      #
      # db.connect() now tolerates that refusal, marks the connection
      # foreign-key-unenforced (foreign keys constrain writes; a session that cannot
      # write needs none), and db's write helpers refuse on such a connection. So
      # least privilege here costs one code path. That is a smaller and truer claim
      # than the one this comment used to make.
      #
      # `set -o pipefail` is load-bearing: without it the step's exit status is
      # tee's, not the audit's, and a red audit would report success. That is the
      # same trap docs/status.md records for piping this tool to `head`.
      - name: coverage_audit
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READ_TOKEN }}
        run: |
          set -o pipefail
          # 2>&1 so the TRACEBACK reaches audit.out and therefore the issue body.
          # The first scheduled run (2026-09-08) died at db.connect() and delivered
          # an EMPTY fence: stdout held nothing, stderr held the only explanation,
          # and tee never saw it. The issue is the delivery surface, and it
          # delivered nothing about the one failure it has ever had to report.
          python -m tools.coverage_audit 2>&1 | tee audit.out

      # The delivery surface. ONE standing issue, reused: a red run comments on the
      # open issue if there is one and opens it if there is not, so a week of red
      # runs is one issue with seven comments rather than seven issues nobody reads.
      # It is never closed from here -- a person closes it, which is what makes the
      # closing an acknowledgement rather than a side effect.
      - name: Raise or update the standing issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: coverage_audit red
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "cc @CSU-J3"
            echo
            echo "\`coverage_audit\` exited non-zero on \`${GITHUB_REF_NAME}\`."
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo "Exit code covers sections 1, 4, 5 and 6, all of which expect 0."
            echo "Sections 2 and 3 are reports and are expected non-empty -- a count"
            echo "there is not the failure. The FIRES lines below are."
            echo
            echo '```'
            # -s, NOT `cat || echo`. The fallback used to key on cat's EXIT STATUS,
            # but tee CREATES audit.out before the tool writes a byte, so on a crash
            # cat SUCCEEDS on an empty file and the marker never fires. 2026-09-08
            # proved it: an empty fence, and the marker written for precisely that
            # case structurally unable to reach it. The condition is now the file
            # being non-empty, which is the thing actually meant.
            if [ -s audit.out ]; then
              cat audit.out
            else
              echo "(nothing captured on stdout or stderr before the audit exited --"
              echo " see the run log linked above)"
            fi
            echo '```'
          } > issue-body.md

          # Exact-title match, not the search ranking: `gh issue list --search` is
          # fuzzy and would happily return a different issue whose body mentions the
          # phrase. Selecting on .title == is what makes reuse deterministic.
          num=$(gh issue list --state open --limit 100 --json number,title \
                  --jq "[.[] | select(.title == \"${TITLE}\")] | first | .number // empty")

          if [ -n "$num" ]; then
            echo "commenting on existing issue #${num}"
            gh issue comment "$num" --body-file issue-body.md
          else
            echo "opening the standing issue"
            gh issue create --title "$TITLE" --body-file issue-body.md
          fi
